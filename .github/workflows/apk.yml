name: APK Android
on:
  push:
    branches: [main]
    paths: ["www/**", "capacitor.config.json", "package.json", ".github/workflows/apk.yml"]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - name: Charger le site en ligne si l'adresse est définie (variable SITE_URL)
        run: |
          if [ -n "${{ vars.SITE_URL }}" ]; then node -e "const f='capacitor.config.json',c=require('./'+f);c.server={url:'${{ vars.SITE_URL }}',cleartext:false};require('fs').writeFileSync(f,JSON.stringify(c,null,2))"; fi
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#0d1823' --iconForegroundColor '#f0a000' || true
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Banc-CACES.apk
      - uses: actions/upload-artifact@v4
        with: { name: Banc-CACES-apk, path: Banc-CACES.apk }
      - name: Publier dans « dernière version »
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest Banc-CACES.apk --title "Dernière version" --notes "APK construit automatiquement à chaque modification." --target "${{ github.sha }}"
