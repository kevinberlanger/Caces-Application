<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0d1823"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"></head><body>
<title>Banc d'évaluation CACES</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout : bandeau « cabine » nuit en tête, sélecteur de recommandation en cartes colorées,
   puis une colonne de travail avec jauge circulaire collante (part de 100, descend à chaque erreur). */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface2:#f3f5f8; --ink:#111a22; --muted:#5a6673; --line:#d9e0e7;
  --night:#0d1823; --night2:#152536; --night-ink:#e9f0f6; --night-muted:#93a6b8;
  --r485:#0b9c86; --r486:#7c4dff; --r489:#f0a000; --rtp:#3a9a48;
  --reco:var(--r489);
  --ok:#1f8a4c; --ok-soft:#dff3e6; --bad:#c62828; --bad-soft:#fbe3e1; --warn:#a86400; --warn-soft:#fcefd6;
  --shadow:0 10px 30px -18px rgba(13,24,35,.45);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1219; --surface:#141e28; --surface2:#1a2632; --ink:#e6edf3; --muted:#93a3b2; --line:#26343f;
  --night:#060c12; --night2:#0f1b27; --night-ink:#e9f0f6; --night-muted:#8ea2b4;
  --r485:#2cc7ae; --r486:#a184ff; --r489:#ffb52e; --rtp:#5cc56a;
  --ok:#4fcf86; --ok-soft:#12301f; --bad:#ff6b5f; --bad-soft:#3a1714; --warn:#f2b14d; --warn-soft:#3a2a10;
  --shadow:0 10px 30px -18px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1219; --surface:#141e28; --surface2:#1a2632; --ink:#e6edf3; --muted:#93a3b2; --line:#26343f;
  --night:#060c12; --night2:#0f1b27; --night-ink:#e9f0f6; --night-muted:#8ea2b4;
  --r485:#2cc7ae; --r486:#a184ff; --r489:#ffb52e; --rtp:#5cc56a;
  --ok:#4fcf86; --ok-soft:#12301f; --bad:#ff6b5f; --bad-soft:#3a1714; --warn:#f2b14d; --warn-soft:#3a2a10;
  --shadow:0 10px 30px -18px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--night)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--reco);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}

/* ---------- bandeau ---------- */
.top{background:radial-gradient(120% 140% at 85% -20%,color-mix(in srgb,var(--reco) 38%,transparent) 0,transparent 55%),linear-gradient(180deg,var(--night2),var(--night));color:var(--night-ink);position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(-45deg,var(--reco) 0 12px,var(--night) 12px 24px);opacity:.9}
.top .wrap{padding-block:18px 0}
.brandrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:44px;height:44px;border-radius:10px;background:var(--reco);color:var(--night);display:grid;place-items:center;flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--reco) 25%,transparent)}
.logo svg{width:30px;height:30px}
.brand h1{font-size:30px;line-height:1;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.brand p{margin:3px 0 0;font-size:13px;color:var(--night-muted)}
.brandrow .sp{flex:1}
.sync{font-size:12px;color:var(--night-muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 30%,transparent)}
.btn-night{border:1px solid color-mix(in srgb,var(--night-ink) 30%,transparent);background:transparent;color:var(--night-ink);border-radius:8px;padding:8px 14px;font-weight:600}
.btn-night:hover{background:color-mix(in srgb,var(--night-ink) 10%,transparent)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:16px;padding-bottom:6px}
.tabs button{background:transparent;border:0;color:var(--night-muted);padding:10px 14px 12px;font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;border-radius:8px 8px 0 0;position:relative}
.tabs button[aria-selected="true"]{color:var(--night-ink)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:14px;right:14px;bottom:4px;height:3px;border-radius:2px;background:var(--reco)}

main{padding-block:22px 80px}

/* ---------- sélecteur de recommandation ---------- */
.recos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}
@media (max-width:760px){.recos{grid-template-columns:repeat(2,minmax(0,1fr))}}
.reco{--c:var(--r489);display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);position:relative;overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s;min-width:0}
.reco .ic{grid-row:span 2;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.reco .ic svg{width:30px;height:30px}
.reco b{font-family:var(--f-display);font-size:24px;line-height:1;font-weight:800}
.reco span{font-size:12.5px;color:var(--muted);line-height:1.25;min-width:0}
.reco .cnt{position:absolute;top:8px;right:10px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.reco:hover:not(:disabled){transform:translateY(-2px);box-shadow:var(--shadow)}
.reco[aria-pressed="true"]{border-color:var(--c);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 18%,var(--surface)),var(--surface) 70%);box-shadow:var(--shadow)}
.reco[aria-pressed="true"] .ic{background:var(--c);color:#0d1823}
.reco:disabled{opacity:.38;cursor:not-allowed;filter:grayscale(.85)}
.reco .lock{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--muted)}

/* ---------- éléments communs ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
label.f input,label.f select,textarea,.inp{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink);min-width:0;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;font-weight:700;font-size:14px}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.pri{background:var(--reco);border-color:var(--reco);color:#0d1823}
.btn.dark{background:var(--night);border-color:var(--night);color:var(--night-ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface2)}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--night);color:var(--night-ink)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.mut{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.reco-p{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.note{font-size:13px;color:var(--muted)}
.empty{padding:34px;text-align:center;color:var(--muted)}
.code{font-family:var(--f-mono);font-weight:600;letter-spacing:.14em;background:var(--surface2);border:1px dashed var(--line);padding:4px 9px;border-radius:6px}

/* ---------- candidats ---------- */
.split{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.clist{display:flex;flex-direction:column;padding:6px}
.citem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:10px;border-radius:10px;align-items:center;cursor:pointer;border:1px solid transparent}
.citem:hover{background:var(--surface2)}
.citem[aria-current="true"]{background:color-mix(in srgb,var(--c) 12%,var(--surface));border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px;background:var(--c);color:#0d1823}
.citem .nm{font-weight:700;min-width:0}
.citem .meta{font-size:12.5px;color:var(--muted)}
.hero-c{display:flex;gap:16px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.hero-c .av{width:58px;height:58px;font-size:24px}
.hero-c h2{font-size:30px;font-weight:800;text-transform:uppercase;line-height:1}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cat{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-width:0;transition:transform .12s}
.cat b{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1}
.cat small{font-size:11.5px;color:var(--muted);line-height:1.25}
.cat[aria-pressed="true"]{background:var(--reco);border-color:var(--reco);color:#0d1823}
.cat[aria-pressed="true"] small{color:#0d1823;opacity:.8}
.cat:hover{transform:translateY(-1px)}
.cats.tabsc{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}

/* ---------- grille pratique ---------- */
.board{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:10;margin-top:6px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;box-shadow:var(--shadow)}
@media (max-width:700px){.board{grid-template-columns:auto 1fr;gap:12px}.board .themes{grid-column:1/-1;order:3}}
.gauge{position:relative;width:118px;height:118px;flex:none}
.gauge svg{width:100%;height:100%}
.gauge .rt{fill:none;stroke:var(--surface2);stroke-width:12}
.gauge .rv{fill:none;stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1),stroke .3s}
.gauge .rv.ok{stroke:var(--ok)} .gauge .rv.bad{stroke:var(--bad)} .gauge .rv.warn{stroke:var(--warn)}
.gauge .tick{stroke:var(--ink);stroke-width:2}
.gauge .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.gauge .ctr b{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:.9}
.gauge .ctr small{font-size:11px;color:var(--muted);font-weight:600}
@media (max-width:700px){.gauge{width:96px;height:96px}.gauge .ctr b{font-size:32px}}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 16px}
.tbar{font-size:12px;min-width:0}
.tbar .lb{display:flex;justify-content:space-between;gap:6px;color:var(--muted);font-weight:600}
.tbar .lb span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar .tr{height:8px;background:var(--surface2);border-radius:4px;position:relative;margin-top:4px;overflow:hidden}
.tbar .fl{position:absolute;inset:0 auto 0 0;background:var(--ok);border-radius:4px;transition:width .4s}
.tbar .fl.low{background:var(--bad)}
.tbar .mid{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--surface)}
.side{display:flex;flex-direction:column;gap:8px;align-items:flex-end;min-width:0}
.verdict{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase;padding:4px 14px;border-radius:8px}
.verdict.ok{background:var(--ok);color:#fff}.verdict.bad{background:var(--bad);color:#fff}.verdict.warn{background:var(--warn);color:#fff}
.checks{display:flex;flex-direction:column;gap:2px;font-size:12px;align-items:flex-end}
.checks .k{display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}.dot.no{background:var(--bad)}
.undo{font-size:13px;padding:7px 11px}
.lost{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.lost b{color:var(--bad)}
.legend{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:14px 2px 0;align-items:center}
.sevl{display:inline-flex;align-items:center;gap:6px;font-weight:600}.sevl i{width:12px;height:12px;border-radius:3px;display:inline-block}
.s1{--s:#d9b100}.s2{--s:#f08a00}.s3{--s:#e2501f}.s4{--s:#b3161c}.sE{--s:var(--ink)}
.sevl i{background:var(--s)}
.sevl i.sE{background:var(--ink)}
.theme{margin-top:26px}
.theme>header{display:flex;align-items:center;gap:12px;padding:0 4px 10px}
.theme>header .tn{font-family:var(--f-display);font-weight:800;font-size:15px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--night);color:var(--night-ink)}
.theme>header h2{font-size:24px;text-transform:uppercase;font-weight:800}
.theme>header .sc{margin-left:auto;font-family:var(--f-mono);font-weight:600;font-size:15px;padding:3px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.theme>header .sc.low{color:var(--bad);border-color:var(--bad)}
.point{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.point.off{opacity:.5;box-shadow:none;background:var(--surface2)}
.point.elim{border-color:var(--bad);box-shadow:0 0 0 2px color-mix(in srgb,var(--bad) 30%,transparent)}
.point>.ph{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,color-mix(in srgb,var(--reco) 9%,var(--surface)),var(--surface) 45%)}
.point.off>.ph{border-bottom:0;background:none}
.pnum{font-family:var(--f-display);font-weight:800;font-size:22px;width:36px;height:36px;display:grid;place-items:center;background:var(--reco);color:#0d1823;border-radius:10px}
.ptitle{font-weight:700;min-width:0}
.ptitle .note{font-weight:500;display:block}
.pscore{font-family:var(--f-mono);font-weight:600;white-space:nowrap;text-align:right}
.pscore.zero{color:var(--bad)}
.sw{width:48px;height:28px;border-radius:14px;border:0;background:var(--line);position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.sw[aria-checked="true"]{background:var(--ok)} .sw[aria-checked="true"]::after{left:23px}
.crit{border-top:1px solid var(--line)}
.crit:first-child{border-top:0}
.ch{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px}
.ch .cl{background:none;border:0;text-align:left;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.ch .cl .tx{display:flex;gap:8px;align-items:baseline;font-weight:500}
.ch .cl .tx::before{content:"▸";color:var(--muted);transition:transform .15s;display:inline-block;font-size:12px}
.crit.open .ch .cl .tx::before{transform:rotate(90deg)}
.errs-sel{display:flex;gap:4px;flex-wrap:wrap}
.errs-sel span{font-size:11.5px;background:var(--bad-soft);color:var(--bad);border-radius:4px;padding:1px 7px;font-weight:700}
.errs-sel span.el{background:var(--bad);color:#fff}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.step button{border:0;background:transparent;width:36px;height:36px;font-size:18px;font-weight:700}
.step output{min-width:60px;text-align:center;font-family:var(--f-mono);font-weight:600}
.step output.zero{color:var(--bad)} .step output.part{color:var(--warn)}
.chips{padding:2px 14px 14px 32px;display:flex;flex-wrap:wrap;gap:8px}
.chipw{display:inline-flex;align-items:stretch}
.chip{min-height:42px;border:1px solid var(--line);border-left:5px solid var(--s);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:500;display:inline-flex;gap:8px;align-items:center;text-align:left;transition:transform .08s,background .15s}
.chip .pen{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--s);background:color-mix(in srgb,var(--s) 14%,transparent);padding:1px 6px;border-radius:4px}
.chip.sE .pen{color:#fff;background:var(--bad)}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--s) 14%,var(--surface));border-color:var(--s)}
.chip:active{transform:scale(.96)}
.chip .cnt{background:var(--bad);color:#fff;border-radius:999px;padding:0 8px;font-size:12px;font-family:var(--f-mono)}
.chipw .chip[aria-pressed="true"]{border-radius:10px 0 0 10px}
.unchip{border:1px solid var(--s);border-left:0;background:var(--surface);color:var(--ink);border-radius:0 10px 10px 0;padding:0 11px;font-size:16px}
.addchip input{width:210px;max-width:100%;background:transparent;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;min-height:42px}
.obs{padding:0 14px 14px}
.obs textarea{width:100%;min-height:40px;font-size:14px;resize:vertical}
.alert{padding:12px 16px;border-radius:12px;font-size:14px;margin-bottom:12px;border:1px solid}
.alert.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}

/* ---------- théorie ---------- */
.qrcard{background:linear-gradient(140deg,var(--night2),var(--night));color:var(--night-ink);border-radius:16px;padding:20px;position:relative;overflow:hidden}
.qrcard::before{content:"";position:absolute;width:260px;height:260px;right:-90px;top:-90px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--reco) 55%,transparent),transparent 70%)}
.qrcard .eyebrow{color:var(--night-muted)}
.qrcard h2{font-size:26px;font-weight:800;text-transform:uppercase;margin:4px 0 14px}
.qrbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;position:relative}
@media (max-width:480px){.qrbox{grid-template-columns:1fr}}
#qr{background:#fff;padding:10px;border-radius:10px;width:max-content;max-width:100%}
#qr img,#qr canvas{display:block}
.bigcode{font-family:var(--f-mono);font-size:30px;font-weight:600;letter-spacing:.2em;color:var(--reco)}
.qrcard .lnk{font-size:12px;color:var(--night-muted);word-break:break-all}

.xattp{background:#fff;color:#111;border:1px solid #ccc;border-radius:8px;padding:28px 30px;font-size:15px;line-height:1.55}
.xatth{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:3px solid #111;padding-bottom:8px;margin-bottom:14px}.xatth span{font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.xattp h3{font-family:var(--f-display);font-size:24px;text-transform:uppercase;margin:0 0 10px}.xattn{font-size:19px;font-weight:700;margin:6px 0}.xattp .note{color:#555}
.xattsig{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:22px;align-items:flex-end}.xattsig img{display:block;height:70px}

button.netb{border:0;background:none;cursor:pointer;padding:6px 8px;border-radius:8px;font:inherit;font-size:12px;color:var(--night-muted)}
button.netb:hover{background:color-mix(in srgb,var(--night-ink) 10%,transparent)}
.netb.net-off i{background:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 30%,transparent)}
.netb.net-sync i,.netb.net-err i{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 30%,transparent)}
.netb.net-off{color:#ffb4ac;font-weight:700}
.offst{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:12px;border:1px solid var(--line)}.offst.on{background:var(--ok-soft);border-color:var(--ok)}.offst.off{background:var(--bad-soft);border-color:var(--bad)}
.offq{margin:0 0 10px;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}.offtips{padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}

.bootcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.bootcols ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
#rescue{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:80;border:0;border-radius:999px;padding:12px 18px;background:#c62828;color:#fff;font:700 15px var(--f-body);box-shadow:0 10px 30px -8px rgba(0,0,0,.5);cursor:pointer;max-width:calc(100vw - 32px)}
@media print{#rescue,.bootb{display:none!important}}

.exgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}
.excard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}.excard p{margin:6px 0 10px}
.exprev{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
@media print{
  body{background:#fff!important;color:#000}header.top,.noprint,.toast,.tabs,body::before{display:none!important}
  main.wrap{padding:0!important;max-width:none}.panel{box-shadow:none!important;break-inside:avoid-page}
  .xsheet tr{break-inside:avoid}.inp{border:0!important;background:none!important}
  body.p-att header.top,body.p-att main{display:none!important}body.p-att .xov{position:static;background:none;padding:0;display:block}body.p-att .xmod{box-shadow:none;border:0;max-height:none;width:100%}body.p-att .xmb{overflow:visible;padding:0}body.p-att .xattp{border:0}
  body.p-page .xov{display:none!important}
}

<script>
/* =========================================================================
   CONFIG
   ========================================================================= */
const ARTIFACT_URL = "https://kevinberlanger.github.io/Caces-Application/";
const REG_MAIL = "kevin.berlanger@dkgroup.fr";
const ALPHA = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const B32 = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";

const ICONS={
 forklift:`<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 23V13h7l4 6v4"/><path d="M7 13V8h5"/><path d="M21 4v19"/><path d="M21 21h8"/><circle cx="8" cy="24" r="3"/><circle cx="16.5" cy="24.5" r="2.2"/></svg>`,
 stacker:`<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4v19M18 4v19"/><path d="M18 21h11"/><path d="M14 23H7v-7h7"/><path d="M8 16 4 6"/><path d="M2.5 6h4"/><circle cx="9" cy="26" r="2"/><circle cx="26" cy="25" r="1.5"/></svg>`,
 pemp:`<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9V4M27 9V4M5 4h22"/><rect x="5" y="8" width="22" height="3" rx="1"/><path d="M8 11l16 9M24 11 8 20"/><rect x="5" y="20" width="22" height="4" rx="1"/><circle cx="9" cy="27" r="2"/><circle cx="23" cy="27" r="2"/></svg>`,
 pallet:`<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22h18"/><path d="M5 15h7v9H5z"/><path d="M8 15 5 5"/><path d="M2.5 5h5"/><circle cx="7" cy="27" r="2"/><circle cx="27" cy="25.5" r="1.5"/><circle cx="20" cy="25.5" r="1.5"/></svg>`
};

/* =========================================================================
   OUTILS DE CONSTRUCTION DES GRILLES
   Nomenclature officielle : Thèmes évalués › Points d'évaluation › Critères › Barème
   ========================================================================= */
const C=(label,max,tag)=>({label,max,tag});
const T=(name,short,points)=>({name,short,points});
const P=(label,crits,note)=>({label,crits,note});
const cont="Évalué en continu durant la totalité des épreuves pratiques";

/* ---------- R.489 ---------- */
function pp489(vis,reg,meca){
  const c=[C("Notice d'instructions (justifier une interdiction d'emploi ou une règle d'utilisation)",1,"docN"),
           C("Rapport de vérification générale périodique / mise en service (absence d'observation ou de restriction)",1,"docV"),
           C("Procéder à une vérification visuelle du chariot",vis,"vis")];
  if(reg) c.push(C("Effectuer les différents réglages relatifs au poste de conduite",reg,"reg"));
  c.push(C("Vérifier le bon fonctionnement des mécanismes et des dispositifs de sécurité",meca,"fct"));
  return P("Vérifier les documents réglementaires, l'état du chariot et ses dispositifs de sécurité",c);
}
const circ=(label,max)=>P(label,[C(label+" — marche avant / arrière, ligne droite / virage, arrêter le chariot",max,"conduite")],cont);
const fin489=()=>P("Fin de poste – maintenance",[C("Réaliser les opérations de fin de poste",5,"fin"),C("Réaliser les opérations de maintenance journalière",5,"fin"),C("Rendre compte des anomalies relevées",5,"fin")]);
const solPal=(a,b,c,eng="chariot")=>P("Prendre, déplacer et déposer au sol une charge palettisée",[C(`S'assurer de l'adéquation du ${eng} à la manutention à réaliser`,a,"adeq"),C(`Positionner le ${eng} pour la prise / positionner la palette sur la fourche`,b,"charge"),C(`Vérifier le lieu de dépose / positionner le ${eng} et déposer la palette avec précision`,c,"charge")]);
const gerb=(a,b,c,d,e,eng="chariot")=>P("Gerber et dégerber au moins 3 charges en pile",[C(`S'assurer de l'adéquation du ${eng} à la manutention à réaliser`,a,"adeq"),C("Apprécier le nombre maximal de niveaux empilables en fonction des charges",b,"charge"),C(`Positionner le ${eng} face aux charges / positionner les charges sur la fourche`,c,"charge"),C("Empiler les charges avec précision sans compromettre la stabilité de la pile",d,"charge"),C("Dépiler les charges et les déposer à l'endroit prévu",e,"charge")]);
const stock=(lbl,a,b,c,d,e)=>P(lbl,[C("S'assurer de l'adéquation du chariot à la manutention à réaliser",a,"adeq"),C("Localiser les emplacements définis / évaluer les risques selon les charges",b,"charge"),C("Vérifier les charges (état de la palette, conditionnement, stabilité…)",c,"charge"),C("Positionner le chariot / prendre et déposer les charges sans heurts",d,"charge"),C("Déstocker les charges et les déposer à l'endroit prévu",e,"charge")]);
const vehSol=(a,b,c,d)=>P("Chargement et déchargement d'un véhicule depuis le sol",[C("S'assurer de l'adéquation du chariot à la manutention à réaliser",a,"adeq"),C("Définir la position appropriée du véhicule et s'assurer que les conditions de l'opération sont remplies",b,"vehicule"),C("Déposer au moins 3 charges sur ou dans le véhicule en équilibrant le chargement",c,"vehicule"),C("Décharger le véhicule et déposer les charges à l'endroit prévu",d,"vehicule")]);
const longue=(a,b,c)=>P("Prise, transport et dépose d'une charge longue / conteneur de liquide / charge déformable",[C("S'assurer de l'adéquation du chariot à la manutention à réaliser",a,"adeq"),C("Définir la méthode de prise et de manutention de la charge",b,"charge"),C("Mettre en œuvre les moyens adaptés / vérifier le lieu de dépose / déposer chaque charge avec précision",c,"charge")]);
const pente=(m)=>P("Circuler en sécurité, s'arrêter et redémarrer sur un plan incliné et/ou un dévers, en charge",[C("Plan incliné / dévers en charge : circuler, s'arrêter, redémarrer",m,"pente")]);
const TH=["Prise de poste et mise en service","Conduite","Manœuvres","Fin de poste – maintenance"];
const SH=["Prise de poste","Conduite","Manœuvres","Fin de poste"];
const std=(a,b,c,d)=>[T(TH[0],SH[0],a),T(TH[1],SH[1],b),T(TH[2],SH[2],c),T(TH[3],SH[3],d)];

function grid489(cat){
  switch(cat){
    case "1A": case "1B": {
      const A=cat==="1A",man=[A?solPal(7,7,7):solPal(3,3,3)];
      if(!A){man.push(gerb(3,3,3,4,3));man.push(stock("Stocker et déstocker 3 palettes à 3 niveaux d'un palettier (du sol jusqu'à 2,90 m minimum)",3,3,3,3,3));}
      const v=A?[7,7,6,7,7]:[3,3,3,3,3];
      man.push(P("Chargement et déchargement d'un véhicule par l'arrière depuis un quai",[C("S'assurer de l'adéquation du chariot et du véhicule à la manutention à réaliser",v[0],"adeq"),C("Mettre en œuvre les moyens d'accès en sécurité au véhicule",v[1],"vehicule"),C("Adapter la vitesse et la trajectoire du chariot",v[2],"conduite"),C("Prendre et déposer 3 charges conformément au plan de chargement",v[3],"vehicule"),C("Décharger le véhicule et déposer les charges à l'endroit prévu",v[4],"vehicule")]));
      return std([pp489(4,0,4)],[circ("Circuler à vide",10),circ("Circuler en charge",10)],man,[fin489()]);
    }
    case "2A": case "2B": {
      const A=cat==="2A";
      const cond=A?[circ("Circuler à vide",16),circ("Circuler en charge",16)]:[circ("Circuler avec au moins une remorque vide attelée",16),circ("Circuler avec au moins une remorque chargée attelée",16)];
      cond.push(pente(8));
      const man=[P("S'assurer de l'adéquation du chariot à la manutention à réaliser",[C("Adéquation du chariot à la manutention à réaliser",20,"adeq")])];
      man.push(A?P("Chargement du plateau porteur",[C("Déterminer la position appropriée d'une charge donnée sur le plateau porteur",5,"charge"),C("Guider le cariste ou le pontier pour positionner la charge à l'endroit défini",5,"guidage"),C("Arrimer la charge sur le plateau porteur",5,"arrimage")])
                :P("Attelage et remorques",[C("Atteler une (ou plusieurs) remorque(s) au chariot",5,"attelage"),C("Arrimer une charge sur la remorque",5,"arrimage"),C("Décrocher la (ou les) remorque(s)",5,"attelage")]));
      return std([pp489(3,2,3)],cond,man,[fin489()]);
    }
    case "3": return std([pp489(3,2,3)],[circ("Circuler à vide",8),circ("Circuler en charge",8),pente(4)],[solPal(3,3,2),gerb(3,3,3,3,2),stock("Stocker et déstocker 3 palettes à 3 niveaux d'un palettier (du sol jusqu'à 3,30 m minimum)",3,3,3,3,2),vehSol(3,3,3,2),longue(3,2,3)],[fin489()]);
    case "4": return std([pp489(3,2,3)],[circ("Circuler à vide",10),circ("Circuler en charge",10)],[solPal(4,3,3),gerb(4,4,4,4,3),vehSol(4,4,4,3),longue(4,4,3)],[fin489()]);
    case "5": return std([pp489(3,2,3)],[circ("Circuler à vide",10),circ("Circuler en charge",10)],[solPal(5,4,4),gerb(5,4,4,4,4),stock("Stocker et déstocker 4 palettes à 4 niveaux d'un palettier (du sol jusqu'à 6 m minimum)",5,4,4,4,4)],[fin489()]);
    case "6": return std([pp489(3,2,3)],
      [circ("Circuler à vide",10),circ("Circuler en charge",10),P("Circuler à vide et en charge en allée réservée",[C("Allée réservée : circulation à vide et en charge, montée / descente à différents niveaux",10,"conduite")],"Marche avant / arrière, montée / descente à différents niveaux")],
      [P("Prendre, déplacer et déposer au sol une charge palettisée",[C("S'assurer de l'adéquation du chariot à la manutention à réaliser",5,"adeq"),C("Positionner le chariot pour la prise / positionner la palette vide sur la fourche",5,"charge"),C("Vérifier le lieu de dépose / déposer la palette avec précision",4,"charge")]),
       P("Constituer une palette par picking à plusieurs niveaux (plancher jusqu'à 2,80 m minimum)",[C("S'assurer de l'adéquation du chariot à la manutention à réaliser",5,"adeq"),C("Positionner correctement le chariot lors des déplacements dans les allées",5,"conduite"),C("Adapter la hauteur de la cabine en fonction du plan de picking",4,"charge"),C("Adapter la hauteur de la palette en fonction du plan de dépose",4,"charge"),C("Déposer la palette constituée en dehors de l'allée de préparation",4,"charge")]),
       P("Manœuvre de secours",[C("Effectuer une manœuvre de secours",5,"secours"),C("Faire effectuer une manœuvre de secours",4,"secours")])],[fin489()]);
    case "7": {
      const one=(n)=>[n===1?pp489(4,0,4):pp489(3,2,3),circ("Circuler à vide avec le chariot",20),circ("Circuler en charge avec le chariot",20),solPal(5,4,4),
        P("Charger et décharger le chariot sur un véhicule de transport (charge sur les bras de fourche)",[C("S'assurer de l'adéquation du chariot et du véhicule à la manœuvre prévue",5,"adeq"),C("S'assurer que la position du véhicule est appropriée et que les conditions sont remplies",4,"vehicule"),C("Positionner le chariot / monter sur le véhicule / mettre le chariot en sécurité",5,"vehicule"),C("Identifier les points d'arrimage / s'assurer de l'adéquation des moyens d'arrimage",4,"arrimage"),C("Décharger le chariot et le ramener à l'endroit prévu",4,"vehicule")]),
        fin489()].map(p=>({...p,label:p.label+(n===1?" — chariot n°1 (1A/1B)":" — chariot n°2 (3/4/5/6)")}));
      const a=one(1),b=one(2);
      return std([a[0],b[0]],[a[1],a[2],b[1],b[2]],[a[3],a[4],b[3],b[4]],[a[5],b[5]]);
    }
  }
  return [];
}

/* ---------- R.485 (gerbeurs à conducteur accompagnant) ---------- */
function grid485(cat){
  const H=cat==="1"?"2,10 m":"3,30 m",g="gerbeur";
  return std(
    [P("Vérifier la présence et la validité des documents réglementaires et savoir les exploiter",[C("Notice d'instructions (justifier une interdiction d'emploi ou une règle d'utilisation)",1,"docN"),C("Rapport de vérification générale périodique / mise en service (absence d'observation ou de restriction)",1,"docV")]),
     P("Vérifier l'état du gerbeur et ses dispositifs de sécurité",[C("Procéder à une vérification visuelle du gerbeur",2,"vis"),C("Vérifier le bon fonctionnement des mécanismes et des dispositifs de sécurité",6,"fct"),C("Vérifier l'adéquation des paramètres de vitesse maxi, accélération et freinage",2,"param")]),
     P("Exploiter la plaque de charge",[C("Exploiter la plaque de charge et déterminer la charge autorisée aux différentes hauteurs accessibles",6,"adeq"),C("Déterminer la masse à vide du gerbeur",2,"adeq")])],
    [P("Circuler à vide",[C("Circuler à vide — marche avant / arrière, ligne droite / virage, arrêter le gerbeur",15,"accomp")],cont),
     P("Circuler en charge",[C("Circuler en charge — marche avant / arrière, ligne droite / virage, arrêter le gerbeur",15,"accomp")],cont)],
    [solPal(3,1,2,g),gerb(3,1,1,2,2,g),
     P(`Stocker et déstocker 3 palettes à tous les niveaux d'un palettier (du sol jusqu'à ${H} minimum)`,[C("S'assurer de l'adéquation du gerbeur à la manutention à réaliser",3,"adeq"),C("S'assurer du bon état du palettier et de son adéquation aux charges",3,"charge"),C("Localiser les emplacements définis / évaluer les risques selon les charges",2,"charge"),C("Vérifier les charges (état de la palette, conditionnement, stabilité…)",1,"charge"),C("Positionner le gerbeur / prendre et déposer les charges sans heurts",2,"charge"),C("Déstocker les charges et les déposer à l'endroit prévu",2,"charge")]),
     P("Chargement et déchargement d'un véhicule par l'arrière depuis un quai ou au moyen d'un hayon",[C("S'assurer de l'adéquation du gerbeur et du véhicule à la manutention à réaliser",3,"adeq"),C("S'assurer de l'état du hayon, du quai niveleur ou du pont de liaison / vérifier son adéquation",3,"vehicule"),C("Mettre en place le hayon, le quai niveleur ou le pont de liaison",2,"vehicule"),C("Adapter la vitesse et la trajectoire du gerbeur",2,"accomp"),C("Prendre et déposer 3 charges conformément au plan de chargement",2,"vehicule"),C("Décharger le véhicule et déposer les charges à l'endroit prévu",2,"vehicule")])],
    [P("Fin de poste – maintenance",[C("Réaliser les opérations de fin de poste",2,"fin"),C("Réaliser les opérations de maintenance journalière",3,"fin"),C("Rendre compte des anomalies relevées",3,"fin")])]);
}

/* ---------- R.486 (PEMP) ---------- */
const docs486=(a,b)=>P("Vérifier la présence et la validité des documents réglementaires et savoir les exploiter",[C("Notice d'instructions (justifier une interdiction d'emploi ou une règle d'utilisation)",a,"docN"),C("Rapport de vérification générale périodique / mise en service (absence d'observation ou de restriction)",b,"docV")]);
const fin486=(a,b,c)=>P("Fin de poste – maintenance",[C("Mettre la PEMP en position hors service",a,"fin"),C("Réaliser les opérations de maintenance journalière",b,"fin"),C("Rendre compte des anomalies relevées",c,"fin")]);
const circ486=(r)=>P("Circulation (évaluée en continu)",[C("Adapter sa conduite aux conditions de circulation (encombrement, virage, obstacle, sol…)",2,"conduite"),C("Effectuer les manœuvres avec souplesse et précision",2,"conduite"),C("Regarder en arrière avant de reculer",r,"conduite"),C("Utiliser correctement l'avertisseur sonore",1,"conduite"),C("Respecter les règles et panneaux de circulation",1,"conduite"),C("Comprendre / exécuter les gestes de commandement",1,"gestes"),C("Savoir réagir à un signal d'alerte",1,"gestes")],cont);
function grid486(cat){
  if(cat==="PE") return [
    T("Chargement de la PEMP","Chargement",[P("Chargement de la PEMP",[C("S'assurer de l'adéquation de la PEMP et du porte-engins à la manœuvre prévue",3,"adeq"),C("S'assurer que la position du véhicule est appropriée",3,"vehicule"),C("Vérifier que les conditions de chargement / déchargement sont remplies (espacement des rampes)",3,"vehicule"),C("Monter la PEMP sur le porte-engins dans le sens approprié",6,"vehicule")])]),
    T("Préparation au transport","Transport",[P("Préparation au transport",[C("Positionner la PEMP sur le porte-engins pour assurer l'équilibre et la stabilité",4,"vehicule"),C("Mettre la PEMP en configuration de transport",3,"stab"),C("Stabiliser la PEMP (freins, stabilisateurs, cales…)",3,"stab")])]),
    T("Préparation de l'arrimage","Arrimage",[P("Préparation de l'arrimage",[C("Identifier et désigner les points d'arrimage sur le porte-engins",2,"arrimage"),C("Identifier et désigner les points d'arrimage sur la PEMP",2,"arrimage"),C("Trouver le mode d'arrimage approprié (notice d'instructions…)",3,"arrimage"),C("S'assurer de l'adéquation des moyens d'arrimage proposés",3,"arrimage")])]),
    T("Déchargement de la PEMP","Déchargement",[P("Déchargement de la PEMP",[C("S'assurer que l'environnement du porte-engins permet le déchargement",3,"vehicule"),C("Positionner la PEMP pour la descente",5,"vehicule"),C("Descendre la PEMP en sécurité",7,"vehicule")])])];
  if(cat==="C") return [
    T("Prise de poste et mise en service","Prise de poste",[docs486(1,2),P("Vérifier l'état de la PEMP et ses dispositifs de sécurité",[C("Procéder à une vérification visuelle de la PEMP",3,"vis"),C("Vérifier le bon fonctionnement des mécanismes et des dispositifs de sécurité accessibles",4,"fct")])]),
    T("Adéquation","Adéquation",[P("Identifier les risques liés à la zone d'évolution",[C("Identifier les risques liés à la zone d'évolution",10,"zone")])]),
    T("Mise en place — PEMP type 1","Mise en place",[P("Mise en place",[C("Baliser la zone d'intervention",5,"zone"),C("Déployer les stabilisateurs",3,"stab"),C("Régler l'horizontalité de la PEMP",6,"stab"),C("Replier les stabilisateurs",3,"stab")])]),
    T("Conduite / manœuvres — PEMP 3B","Conduite 3B",[P("Circulation (évaluée en continu)",[C("Adapter sa conduite aux conditions de circulation (encombrement, virage, obstacle, sol…)",2,"conduite"),C("Effectuer les manœuvres avec souplesse et précision",2,"conduite"),C("Regarder en arrière avant de reculer",2,"conduite"),C("Utiliser correctement l'avertisseur sonore",2,"conduite"),C("Respecter les règles et panneaux de circulation",2,"conduite"),C("Comprendre / exécuter les gestes de commandement",2,"gestes"),C("Savoir réagir à un signal d'alerte",2,"gestes")],cont),
      P("Manœuvres plate-forme en position basse",[C("Positionner la PEMP à un emplacement précis (aire limitée au sol)",4,"conduite"),C("Circuler plate-forme basse orientée dans le sens de la marche",6,"conduite"),C("Circuler plate-forme basse orientée dans le sens inverse de la marche",6,"conduite"),C("Effectuer les manœuvres de secours (commandes de secours et de dépannage)",6,"secours")])]),

ementation et acteurs"],["cg","Une PEMP dont la projection verticale du centre de gravité de la charge peut sortir des lignes de basculement appartient au groupe B.",1,"","","Groupes et types de PEMP"],["cg","Une nacelle articulée à bras télescopique, avec déport, appartient au groupe A.",0,"","Avec déport : groupe B.","Groupes et types de PEMP"],["cg","Une PEMP de type 1 ne peut se déplacer qu'en position de transport.",1,"","","Groupes et types de PEMP"],["te","Les stabilisateurs servent à élargir la base d'appui de la PEMP.",1,"","","Technologie et dispositifs de sécurité"],["te","La plate-forme de travail est l'endroit où se tiennent les opérateurs.",1,"","","Technologie et dispositifs de sécurité"],["te","Avec une plate-forme dont le plancher monte à 10 m, l'opérateur ne peut pas travailler au-dessus de 10 m.",0,"","Hauteur de travail ≈ plancher + 2 m.","Technologie et dispositifs de sécurité"],["te","Le dévers correspond à la distance horizontale entre le pied de la tourelle et le bord de la plate-forme.",0,"","Ça, c'est le déport ; le dévers est une inclinaison.","Technologie et dispositifs de sécurité"],["te","Les organes de commande doivent être protégés contre les actionnements involontaires.",1,"","","Technologie et dispositifs de sécurité"],["te","L'arrêt d'urgence n'arrête que la translation de la PEMP.",0,"","Il arrête tous les mouvements.","Technologie et dispositifs de sécurité"],["te","Le poste de commande au sol permet de redescendre la plate-forme en cas de besoin.",1,"","","Technologie et dispositifs de sécurité"],["te","Le poste de commande principal se trouve sur la plate-forme de travail.",1,"","","Technologie et dispositifs de sécurité"],["te","Une commande relâchée doit revenir d'elle-même en position neutre.",1,"","","Technologie et dispositifs de sécurité"],["te","Le limiteur de pression protège le circuit hydraulique contre les surpressions.",1,"","","Technologie et dispositifs de sécurité"],["te","Appuyer sur la pédale de validation (hom const DOSSIER=[
 ["conv","Convocation envoyée","date, créneau, lieu",null,c=>c.invite&&c.invite.sentAt],
 ["insc","Préinscription reçue et certifiée par le candidat","formulaire en ligne",null,c=>c.insc&&c.insc.certifieLe],

 ["acces","Plan d'accès, horaires et contact sur place transmis","",null,null],
 ["epi","Liste des EPI à apporter communiquée","chaussures, gants, gilet…",null,null],
 ["rgt","Règlement intérieur / livret d'accueil remis","",null,null],
 ["photo","Photo d'identité sur fond blanc reçue","obligatoire, envoyée avec la préinscription",null,c=>c.photo&&c.photo.url&&c.photo.white>=0.6&&c.photo.at],
 ["id","Pièce d'identité demandée pour le jour J","",null,null],
 ["prev","Copie du CACES® / de l'autorisation précédente reçue","recyclage",c=>c.profil==="recyclage",null],
 ["handi","Aménagement traité avec le référent handicap","besoin signalé à l'inscription",c=>c.insc&&c.insc.adaptation==="oui",null],
 ["emarg","Feuille d'émargement préparée","",null,null]];
const dosItems=c=>DOSSIER.filter(it=>!it[3]||it[3](c));
const dosDone=(c,it)=>(c.dossier&&c.dossier[it[0]]&&c.dossier[it[0]].d)||(it[4]&&it[4](c))||null;
const dosProg=c=>{const L=dosItems(c),d=L.filter(it=>dosDone(c,it));return {n:d.length,m:L.length,miss:L.filter(it=>!dosDone(c,it))};};
const dShort=d=>new Date(d).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"});
const candName=c=>`<b>${esc((c.nom||"—").toUpperCase())}</b> ${esc(c.prenom||"")}`;
function dayCands(){return Object.values(S.cands).filter(x=>x.dateTest===S.hday).sort((a,b)=>RECO_ORDER.indexOf(a.reco)-RECO_ORDER.indexOf(b.reco)||(a.nom||"").localeCompare(b.nom||""));}

    const pr=c.cats.map(k=>{const p=(c.prat||{})[k]||{},rr=scorePrat(c,k),st=!p.t0?"mut":!p.t1&&!(p.elim||[]).length?"warn":rr.ok?"ok":"bad",lab=!p.t0?"à démarrer":!p.t1&&!(p.elim||[]).length?"en cours":fmt(rr.pct)+" %";return `<button class="pill ${st} pbtn" data-act="hgo" data-tab="prat" data-id="${c.id}" data-cat="${k}" title="Ouvrir la grille ${k}">${k} · ${lab}</button>`}).join("");

      act=`<button class="btn pri" data-act="hkiosk" data-id="${c.id}" title="Ouvre le QCM tel que le candidat le verra, sur cet appareil">▶ QCM apprenant</button><button class="btn" data-act="hgo" data-tab="theo" data-id="${c.id}">Théorie</button><button class="btn" data-act="hgo" data-tab="cand" data-id="${c.id}">Dossier</button>`;}

/* avancement du dossier : étape kanban + code couleur */
const STAGES=[["demande","Demande / invitation","Préinscription non reçue","#d64545"],["dossier","Dossier en cours","Pièces ou informations manquantes","#e8871e"],["pret","Prêt à passer","Dossier complet, test non commencé","#d9b310"],["test","En test","Théorie ou pratique commencée","#3b82f6"],["fini","Terminé","Théorie validée et pratique clôturée","#1f9d55"]];
function stageOf(c){const p=c.prat||{},started=(c.theo&&c.theo.qcm)||c.cats.some(k=>p[k]&&p[k].t0);
  const done=c.theo&&c.theo.val&&c.cats.length&&c.cats.every(k=>p[k]&&(p[k].t1||(p[k].elim||[]).length));
  if(done)return "fini";if(started)return "test";if(c.statut!=="inscrit")return "demande";const d=dosProg(c);return d.n<d.m?"dossier":"pret";}
const stageInfo=k=>STAGES.find(x=>x[0]===k)||STAGES[0];
const stagePill=c=>{const s=stageInfo(stageOf(c));return `<span class="spill" style="--sc:${s[3]}" title="${esc(s[2])}"><i></i>${esc(s[1])}</span>`;};
const dosColor=d=>{const r=d.m?d.n/d.m:0;return r>=1?"#1f9d55":r>=.67?"#d9b310":r>=.34?"#e8871e":"#d64545";};
function dosKanban(all){
  return `<div class="kanban">${STAGES.map(([k,l,h,col])=>{const L=all.filter(x=>stageOf(x)===k);return `<section class="kcol" style="--sc:${col}"><header><i></i><b>${l}</b><span class="kn">${L.length}</span></header><p class="note">${h}</p>
    ${L.map(x=>{const d=dosProg(x),pc=d.m?Math.round(d.n/d.m*100):0,dc=dosColor(d);return `<button class="kcard" data-act="dosopen" data-id="${x.id}" style="--dc:${dc}"><div class="row" style="gap:6px;flex-wrap:nowrap"><span style="min-width:0;flex:1">${candName(x)}</span><span class="pill mut">${x.type==="CACES"?"CACES®":"ACES"}</span></div>
      <div class="note">${RECOS[x.reco].label} ${x.cats.join(", ")} · ${frDate(x.dateTest)}</div>
      <div class="kbar"><span style="width:${pc}%"></span></div><div class="note"><b style="color:${dc}">Dossier ${d.n}/${d.m}</b>${d.miss.length?" · manque : "+esc(d.miss[0][1].split(" (")[0])+(d.miss.length>1?" +"+(d.miss.length-1):""):""}</div></button>`}).join("")||`<div class="kempty">—</div>`}</section>`}).join("")}</div>`;
}

    ${photoBlock(c)}

async function finishQuiz(){
  const z=S.quiz,bank=qBank(z),ans=bank.map((q,i)=>z.ans[i]?"1":"0").join(""),bits=ansToBits(bank,ans),now=new Date().toISOString();
  z.result=encodeResult(z.code,z.reco,ans);z.sent=false;
  if(z.cand){const prev=z.cand.theo&&z.cand.theo.qcm,qcm={ans,bits,date:now,candVal:now,source:S.db?"db":"local",attempts:[...((prev&&prev.attempts)||[]),{ans,bits,date:now}],reopenCount:(prev&&prev.reopenCount)||0,reopen:prev&&prev.reopen?{...prev.reopen,done:true}:null};
    if(S.db){try{await S.db.collection("candidats").doc(z.cand.id).update({theo:{qcm}});z.sent=true;}catch(e){}}
    else if(S.cands[z.cand.id]){S.cands[z.cand.id].theo.qcm=qcm;persist(S.cands[z.cand.id]);z.sent=true;}}

/* =========================================================================
   PRÉ-INSCRIPTION — invitation par mail, formulaire candidat, relevé des réponses
   (aligné KODO : aucune donnée de santé, besoin d'adaptation en oui / non, certification horodatée)
   ========================================================================= */
const NIVEAUX=[["deb","Débutant","Jamais ou très peu conduit ce type d'engin"],["int","Intermédiaire","Utilisation occasionnelle"],["conf","Confirmé","Utilisation régulière ou recyclage"]];
const CHAMPS=["Entrepôt / logistique","Atelier de production","Quai de chargement","Chantier / extérieur","Magasin / surface de vente","Maintenance","Autre"];
const EXPS=["Aucune","Moins de 6 mois","6 mois à 2 ans","Plus de 2 ans"];
const STATUTS={manuel:["Créé ici","mut"],invite:["Invité","warn"],inscrit:["Validé sur la session","ok"]};
const nivLabel=k=>(NIVEAUX.find(x=>x[0]===k)||[,"—"])[1];
const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return decodeURIComponent(escape(atob(s)));};
function encodeInsc(o){const p=b64e(JSON.stringify(o));return "INSC."+p+"."+chk(p);}
function decodeInscAll(text){
  const flat=String(text||"").replace(/[\s>]+/g,""),out=[],re=/INSC\.([A-Za-z0-9_-]{20,})\.([0-9A-Z]{2})/g;let m;
  while((m=re.exec(flat))){if(chk(m[1])!==m[2])continue;try{out.push(JSON.parse(b64d(m[1])));}catch(e){}}
  return out;
}
const inscLink=c=>ARTIFACT_URL+"#I"+c.code+c.reco;
function inviteText(c,msg){
  const r=recoOf(c);
  return `Bonjour,

Vous êtes pré-inscrit(e) à la formation ${r.label} — ${r.name}${c.cats.length?" (catégorie "+c.cats.join(", ")+")":""}, session ${periodTxt(c)}.
${msg?"\n"+msg+"\n":""}
Merci de compléter votre fiche d'inscription (environ 5 minutes) en ouvrant ce lien :
${inscLink(c)}

Si le formulaire ne peut pas vous enregistrer directement, il vous affichera un code de confirmation. Il suffit alors de répondre à ce mail en collant ce code.

Cordialement,`;
}
const inviteSubject=c=>`Inscription formation ${recoOf(c).label} — session ${periodTxt(c)}`;
function mcpErrText(e){
  const c=e&&e.code;
  if(c==="queued")return "Hors connexion : mail en file d'attente, il partira tout seul au retour du réseau.";
  if(c==="server_not_connected"||c==="server_not_found")return "Gmail n'est pas connecté : ajoutez-le dans claude.ai, Réglages › Connecteurs.";
  if(c==="needs_reauth")return "La connexion Gmail a expiré : reconnectez Gmail dans claude.ai, Réglages › Connecteurs.";
  if(c==="approval_required"||c==="not_in_manifest"||c==="consent_required")return "Gmail n'est pas autorisé pour cette page : relancez l'action et acceptez la demande.";
  if(c==="selection_required")return "Plusieurs comptes Gmail : choisissez celui à utiliser dans la fenêtre proposée.";
  if(c==="blocked_by_policy")return "Votre organisation bloque cet envoi.";
  if(c==="tool_error")return "Gmail a refusé : "+(e.message||"erreur");
  return "Envoi incertain ("+(c||"erreur")+") : vérifiez vos messages envoyés avant de renvoyer.";
}

async function sendInvites(){
  const v=S.inv,emails=[...new Set(v.emails.split(/[\s,;]+/).map(x=>x.trim().toLowerCase()).filter(x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x)))];

  if(!v.cats.length){toast("Choisissez au moins une catégorie");return;}
  v.busy=true;v.results=[];render();
  for(const email of emails){
    const c=newCand(v.reco);Object.assign(c,{email,profil:v.prof[email]||"",formateurId:v.formateurId||"",testeurId:v.testeurId||"",type:RECOS[v.reco].caces?v.type:"ACES",cats:sortCats(v.reco,v.cats),dateTest:v.date,statut:"invite",invite:{createdAt:new Date().toISOString(),sentAt:null}});

    if(S.mcp){
      try{await S.mcp.callTool("Gmail","send_message",{to:[email],subject:inviteSubject(c),body:inviteText(c,composeMsg(v,c.profil)),includeSignature:true});

async function fetchReplies(){
  if(!S.mcp){toast("Relevé automatique indisponible : collez le code reçu");return;}
  S.inv.fetching=true;S.inv.fetchMsg="Recherche dans Gmail…";render();
  let found=0,applied=0;
  try{
    const r=await S.mcp.callTool("Gmail","search_threads",{query:'subject:("Inscription formation" OR "Avis formation") -from:me newer_than:120d',pageSize:30},{cache:false});
    let pl=r.payload;if(typeof pl==="string"){try{pl=JSON.parse(pl)}catch(e){pl={}}}
    const threads=(pl&&pl.threads)||[];
    for(const t of threads){
      try{const tr=await S.mcp.callTool("Gmail","get_thread",{threadId:t.id,messageFormat:"PLAIN_TEXT"},{cache:false});
        let tp=tr.payload;if(typeof tp==="string"){try{tp=JSON.parse(tp)}catch(e){tp={}}}
        for(const m of (tp&&tp.messages)||[]){for(const o of decodeTok("AVIS",(m.plaintextBody||"")+" "+(m.snippet||""))){found++;const c=Object.values(S.cands).find(x=>x.code===o.c);if(c&&(!c.satis||(c.satis.date||"")<(o.ts||""))){applyAvis(c,o,"mail");applied++;}}
        for(const o of decodeInscAll((m.plaintextBody||"")+" "+(m.snippet||""))){found++;
          const c=Object.values(S.cands).find(x=>x.code===o.c);if(c&&(!c.insc||(c.insc.certifieLe||"")<(o.ts||""))){applyInsc(c,o,"mail");applied++;}}}
      }catch(e){}
    }
    S.inv.fetchMsg=`${threads.length} conversation(s) lue(s) · ${found} code(s) trouvé(s) · ${applied} inscription(s) enregistrée(s).`;
  }catch(e){S.inv.fetchMsg=mcpErrText(e).replace("Envoi","Relevé");}
  S.inv.fetching=false;render();
}
function importInscCode(text){
  const list=decodeInscAll(text);if(!list.length){toast("Code d'inscription invalide");return;}
  let n=0;list.forEach(o=>{let c=Object.values(S.cands).find(x=>x.code===o.c);if(!c){c=newCand(RECOS[o.r]?o.r:"R489");c.code=o.c;S.cands[c.id]=c;}applyInsc(c,o,"code");n++;});
  toast(n+" inscription(s) importée(s)");render();
}

/* photo d'identité : recadrage 3:4, 300×400, JPEG ; contrôle du fond (bords clairs et peu colorés) */
function procPhoto(file){return new Promise((res,rej)=>{if(!file||!/^image\//.test(file.type))return rej(new Error("Choisissez une image (JPG ou PNG)."));
  const fr=new FileReader();fr.onerror=()=>rej(new Error("Lecture impossible"));fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error("Image illisible"));im.onload=()=>{
    const W=300,H=400,cv=document.createElement("canvas");cv.width=W;cv.height=H;const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,W,H);
    const s=Math.max(W/im.width,H/im.height),w=im.width*s,h=im.height*s;g.drawImage(im,(W-w)/2,(H-h)/2,w,h);
    const d=g.getImageData(0,0,W,H).data;let n=0,ok=0;const px=(x,y)=>{const i=(y*W+x)*4,r=d[i],gg=d[i+1],b=d[i+2],mx=Math.max(r,gg,b),mn=Math.min(r,gg,b);n++;if(mn>=185&&mx-mn<=40)ok++;};
    for(let y=0;y<H*0.55;y+=3){for(let x=0;x<W*0.12;x+=3){px(x,y);px(W-1-x,y);}}for(let y=0;y<H*0.08;y+=3)for(let x=0;x<W;x+=3)px(x,y);
    res({url:cv.toDataURL("image/jpeg",0.82),white:ok/n});};im.src=fr.result;};fr.readAsDataURL(file);});}
const photoOf=c=>c&&c.photo&&c.photo.url?c.photo:null;
const avatar=(c,cls)=>photoOf(c)?`<img class="av avp ${cls||""}" src="${photoOf(c).url}" alt="Photo de ${esc((c.prenom||"")+" "+(c.nom||""))}">`:`<span class="av ${cls||""}">${esc(initials(c))}</span>`;
function photoBlock(c,scope){const p=photoOf(c);return `<div class="phb ${p&&p.white<0.6?"warn":""}">${p?`<img src="${p.url}" alt="Photo d'identité">`:`<div class="phnone">Pas de photo</div>`}<div><b>Photo d'identité</b><div class="note">${p?(p.white<0.6?"⚠ Le fond ne semble pas blanc : à refaire.":"Fond blanc vérifié.")+" Reçue le "+frDate((p.at||"").slice(0,10)):"Obligatoire : fond blanc uni, visage de face, tête nue."}</div>
  <label class="btn phup">${p?"Remplacer":"Ajouter une photo"}<input type="file" accept="image/*" capture="user" data-candph="${c.id}" hidden></label>${p?` <button class="btn" data-act="phdel" data-id="${c.id}">Retirer</button>`:""}</div></div>`;}
async function submitReg(){
  const z=S.reg,f=z.f;
  const miss=[!f.n&&"nom",!f.p&&"prénom",!f.d&&"date de naissance",!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.e)&&"adresse mail",!f.ch.length&&"champ d'intervention",!f.nv&&"niveau",!f.ad&&"besoin d'aménagement",!f.am&&"attestation médicale",f.pf==="recyclage"&&!f.cd.trim()&&"CACES ou autorisation précédent (recyclage)",f.en==="__autre"&&!(f.ena||"").trim()&&"nom de l'entreprise",!f.ph&&!f.phl&&"photo d'identité",f.ph&&f.phw<0.35&&"photo sur fond blanc",!f.ok1&&"certification",!f.ok2&&"accord d'utilisation"].filter(Boolean);
  if(miss.length){z.err="À compléter : "+miss.join(", ")+".";render();return;}
  z.err="";z.busy=true;render();
  const o={c:z.code,r:z.reco||"R489",pf:f.pf,n:f.n.trim(),p:f.p.trim(),d:f.d,e:f.e.trim(),t:f.t.trim(),en:(f.en==="__autre"?(f.ena||""):f.en||"").trim(),emp:(()=>{const e=entFind(f.en);return f.en==="__autre"||(f.en&&!e)?{siret:(f.es||"").trim(),adr:(f.ead||"").trim(),sg:(f.esg||"").trim()}:(e||null);})(),po:f.po.trim(),ch:f.ch,ca:f.ca.trim(),nv:f.nv,xp:f.xp,cd:f.cd.trim(),am:f.am,ad:f.ad,ts:new Date().toISOString()};
  z.result=encodeInsc(o);z.sent=false;
  if(z.cand){
    if(S.db){try{await S.db.collection("candidats").doc(z.cand.id).update({profil:o.pf||"",nom:o.n,prenom:o.p,naissance:o.d,email:o.e,tel:o.t,entreprise:o.en,statut:"inscrit",insc:{poste:o.po,champs:o.ch,champAutre:o.ca,niveau:o.nv,exp:o.xp,cacesDetenus:o.cd,attestMed:o.am,adaptation:o.ad,employeur:o.emp||null,certifieLe:o.ts,source:"formulaire"},...(f.ph?{photo:{url:f.ph,white:f.phw,at:o.ts,src:"candidat"}}:{})});z.sent=true;}catch(e){}}
    else if(S.cands[z.cand.id]){const cc=S.cands[z.cand.id];if(f.ph)cc.photo={url:f.ph,white:f.phw,at:o.ts,src:"candidat"};applyInsc(cc,o,"formulaire");z.sent=true;}
  }
  z.busy=false;z.stage="done";render();
}

function encodeTok(pre,o){const p=b64e(JSON.stringify(o));return pre+"."+p+"."+chk(p);}
function decodeTok(pre,text){const flat=String(text||"").replace(/[\s>]+/g,""),out=[],re=new RegExp(pre+"\\.([A-Za-z0-9_-]{20,})\\.([0-9A-Z]{2})","g");let m;while((m=re.exec(flat))){if(chk(m[1])!==m[2])continue;try{out.push(JSON.parse(b64d(m[1])));}catch(e){}}return out;}

const SLOTS=[["6h – 13h","Poste du matin",[["06:00","13:00"]]],["13h – 20h","Poste d'après-midi",[["13:00","20:00"]]],["7h – 14h","Décalé matin",[["07:00","14:00"]]],["8h – 12h","Matinée",[["08:00","12:00"]]],["13h – 16h30","Après-midi",[["13:00","16:30"]]],["Journée","8h – 12h / 13h – 16h30",[["08:00","12:00"],["13:00","16:30"]]]];

function epiAvail(reco,cats){const b=["chaus","gants","gilet","lunettes","auditif","meteo"];if(reco==="R486")return [...b,"casqueJ","harnais"];const r=[...b,"casque"];if(reco==="R489"&&cats.includes("6"))r.push("harnais");return r;}
function epiDefault(reco,cats){const d=["chaus","gants","gilet"];if(reco==="R486"){d.push("casqueJ");if(cats.includes("B"))d.push("harnais");}if(reco==="R489"&&cats.includes("6"))d.push("harnais");return d;}
function epiPacks(reco,cats){const base=["chaus","gants","gilet"],p=[["Lot de base",base]];
  if(reco==="R486")p.push(["Lot PEMP",[...base,"casqueJ","harnais"]]);
  if(reco==="R489"&&cats.includes("6"))p.push(["Lot cat. 6 (poste élevable)",[...base,"harnais"]]);
  p.push(["Lot extérieur",[...base,...(reco==="R486"?["casqueJ"]:[]),"meteo"]]);return p;}
function invSync(){const v=S.inv,b=v.b,av=epiAvail(v.reco,v.cats);b.epi=b.epi.filter(x=>av.includes(x));}
const hfr=t=>{if(!t)return "";const [h,m]=t.split(":");return Number(h)+" h "+m;};
const listFr=a=>a.length<2?a.join(""):a.slice(0,-1).join(", ")+" et "+a[a.length-1];
function composeMsg(v,profil){
  const b=v.b,out=[];
  if(b.conv!==null&&b.conv!==undefined){
    const ranges=b.conv==="custom"?[[b.cs1,b.ce1],...(b.cs2&&b.ce2?[[b.cs2,b.ce2]]:[])].filter(x=>x[0]&&x[1]):SLOTS[b.conv][2];
    if(ranges.length)out.push(`Convocation : la formation a lieu le ${frDate(v.date)} ${ranges.map(([a,z])=>"de "+hfr(a)+" à "+hfr(z)).join(" puis ")}. Merci de vous présenter ${b.adv||10} minutes avant le début, muni(e) d'une pièce d'identité.`);
  }
  if(b.epi.length)out.push(`Équipements de protection individuelle obligatoires pour la pratique : ${listFr(b.epi.map(k=>EPIS[k]))}. ${b.epiFourni?"Ils vous seront fournis sur place.":"Merci de venir équipé(e) : sans ces équipements, la pratique et l'évaluation ne pourront pas avoir lieu."}`);
  if(profil==="initiale")out.push("Formation initiale : aucune expérience de conduite n'est demandée, la formation reprend toutes les bases.");

  if(v.msg.trim())out.push(v.msg.trim());
  return out.join("\n\n");
}

  :(()=>{if(!S.sandbox||S.sandbox.reco!==rk||S.sandbox.cats[0]!==cat)S.sandbox={id:"_sandbox",reco:rk,cats:[cat],type:"ACES",prat:{},theo:{mode:"qcm",manuel:{}},notes:[],dateTest:"",code:"",nom:"Bac à sable"};S.cat=cat;

/* ---------- unités de test (planning) ---------- */
function utPanel(s){
  const byT={},cand=[];
  s.cands.forEach(c=>{const prat=c.cats.reduce((a,k)=>a+(utOf(c.reco,k)||0),0),theo=UT[c.reco].theo||0;cand.push({c,prat,theo,tot:prat+theo});
    const t=c.testeurId||"_";(byT[t]=byT[t]||{prat:0,theoN:0}).prat+=prat;if(theo)byT[t].theoN++;});
  const rows=Object.entries(byT).map(([id,v])=>{const theoUT=Math.ceil(v.theoN/12)*(UT[s.reco].theo||0),tot=v.prat+theoUT;return {id,name:id==="_"?"Testeur non désigné":intName(intById(id)),prat:v.prat,theoUT,tot,okP:v.prat<=6,okT:tot<=7};});
  const caces=s.cands.some(c=>c.type==="CACES"),f=n=>String(Math.round(n*100)/100).replace(".",",");
  return `<section class="panel pad"><div class="eyebrow">Unités de test (1 UT = 1 h ± 10 min) · ${caces?"limites obligatoires en CACES®":"repère indicatif en autorisation de conduite"}</div><h2 style="font-size:22px;font-weight:800;text-transform:uppercase">Charge de la journée</h2>
    <table><thead><tr><th>Testeur</th><th style="text-align:right">Théorie</th><th style="text-align:right">Pratique (≤ 6)</th><th style="text-align:right">Total (≤ 7)</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td class="mono" style="text-align:right">${f(x.theoUT)}</td><td class="mono" style="text-align:right;${x.okP?"":"color:var(--bad);font-weight:700"}">${f(x.prat)}</td><td class="mono" style="text-align:right;${x.okT?"":"color:var(--bad);font-weight:700"}">${f(x.tot)}</td></tr>`).join("")}</tbody></table>
    <details id="det_ut" ${S.det.det_ut?"open":""} style="margin-top:8px"><summary class="note" style="cursor:pointer">Détail par candidat (≤ 7 UT par jour)</summary><table><tbody>${cand.map(x=>`<tr><td>${esc(x.c.nom?x.c.nom.toUpperCase()+" "+x.c.prenom:x.c.email)}</td><td class="note">${x.c.cats.map(k=>k+" "+f(utOf(x.c.reco,k)||0)).join(" · ")}</td><td class="mono" style="text-align:right;${x.tot>7?"color:var(--bad);font-weight:700":""}">${f(x.tot)} UT</td></tr>`).join("")}</tbody></table></details>
    ${rows.some(x=>!x.okP||!x.okT)||cand.some(x=>x.tot>7)?`<div class="alert warn" style="margin-top:10px">${caces?"Dépassement des limites R.4xx : répartissez les candidats sur une autre journée ou un autre testeur.":"Au-delà du repère CACES® : pas de limite réglementaire en autorisation de conduite, mais vérifiez que l'évaluation reste sereine."}</div>`:""}
    <p class="note" style="margin-bottom:0">Théorie : 1 UT par groupe de 12 candidats au plus. Barèmes UT : annexe A3/3 de chaque recommandation.</p></section>`;
}

/* =========================================================================
   GRILLE RÉGLABLE : œil (épreuve / critère), quantités, grilles types, bac à sable
   ========================================================================= */
const EYE=`<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>`;
const EYEOFF=`<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.8 10.8 0 0 1 12 19C5 19 1 12 1 12a19.6 19.6 0 0 1 5.1-5.9M9.9 5.2A10 10 0 0 1 12 5c7 0 11 7 11 7a19.4 19.4 0 0 1-2.2 3.2M14.1 14.1a3 3 0 0 1-4.2-4.2"/><path d="M1 1l22 22"/></svg>`;
const QTY_RE=/(au moins |)(\d+)( (?:palettes|charges|niveaux))/;
const qtyBase=pt=>{const m=pt.label.match(QTY_RE);return m?Number(m[2]):null;};
function ptLabel(p,pt,c){if(c&&!isAces(c))return pt.label;const m=pt.label.match(QTY_RE);if(!m||!p.qty||!p.qty[pt.id])return pt.label;return pt.label.replace(QTY_RE,(_,a,n,b)=>a+p.qty[pt.id]+b+" (au lieu de "+n+")");}
const isAces=c=>c.type!=="CACES";
const critOn=(p,cr)=>!(p.offc&&p.offc[cr.id]);
function activeCrits(c,cat,pt){const p=prat(c,cat);return isAces(c)?pt.crits.filter(cr=>critOn(p,cr)):pt.crits;}
function tplList(reco,cat){return Object.values(S.tpls).filter(t=>t.reco===reco&&t.cat===cat).sort((a,b)=>a.name.localeCompare(b.name));}
function saveTpl(t){S.tpls[t.id]=t;if(S.db)S.db.collection("gabarits").doc(t.id).set(t).catch(()=>setSync("Échec d'enregistrement"));else LS.set("caces.tpls",S.tpls);}
function delTpl(id){delete S.tpls[id];if(S.db)S.db.collection("gabarits").doc(id).delete().catch(()=>{});else LS.set("caces.tpls",S.tpls);}
function applyTpl(c,cat,t){const p=prat(c,cat);p.off={...(t.off||{})};p.offc={...(t.offc||{})};p.qty={...(t.qty||{})};p.na={...(t.na||{})};persist(c);}
function adjCount(p){return Object.values(p.na||{}).filter(Boolean).length+Object.values(p.off||{}).filter(Boolean).length+Object.values(p.offc||{}).filter(Boolean).length+Object.values(p.qty||{}).filter(Boolean).length;}
function tplBar(c,cat,sandbox){
  const p=prat(c,cat),list=tplList(c.reco,cat),n=adjCount(p);
  return `<div class="tplbar"><div class="row" style="gap:8px;flex:1;min-width:240px"><span class="eyebrow">Grille type</span>
      <select id="tplsel" class="inp" data-tplsel="1" style="padding:7px 9px;min-width:180px"><option value="">${list.length?"Choisir une grille type…":"Aucune grille type pour "+cat}</option>${list.map(t=>`<option value="${t.id}" ${S.tplPick===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}</select>
      <button class="btn" data-act="tplapply" ${S.tplPick?"":"disabled"}>Appliquer</button>${sandbox&&S.tplPick?`<button class="btn danger" data-act="tpldel">Supprimer</button>`:""}</div>
    <div class="row" style="gap:8px">${n?`<span class="pill warn">${n} réglage(s)</span><button class="btn" data-act="tplreset">Tout réafficher</button>`:`<span class="note">Grille complète</span>`}
      ${sandbox?`<input id="tplname" class="inp" data-tplname="1" value="${esc(S.tplName||"")}" placeholder="Nom (ex. Site DT Signs, palettier 2 niveaux)" style="min-width:220px"><button class="btn pri" data-act="tplsave">Enregistrer comme grille type</button>`:""}</div></div>`;
}

   ENGAGEMENT SIGNÉ DU CANDIDAT AU DÉPART DE L'ÉPREUVE PRATIQUE
   ========================================================================= */
const CONSENT_ITEMS=[
 "J'ai reçu les consignes de déroulement de l'épreuve pratique et les règles de sécurité du site.",
 "Je porte les équipements de protection individuelle demandés.",
 "J'accepte que le testeur arrête l'épreuve à tout moment s'il estime que ma conduite présente un danger pour moi, pour les autres ou pour le matériel.",
 "Je sais qu'une chute de charge ou la mise en danger d'une personne, signes de non-maîtrise de l'engin, entraînent l'échec de l'épreuve.",
 "Je me déclare en état de conduire et je signale au testeur tout empêchement (fatigue, malaise…) avant ou pendant l'épreuve."];
function consentOf(c){return (c.consent&&c.consent.sig)?c.consent:null;}
function consentPanel(c,mandatory){
  const d=S.consentDraft||(S.consentDraft={items:{},has:false});
  const all=CONSENT_ITEMS.every((_,i)=>d.items[i]);
  return `<section class="panel pad consent ${mandatory?"mand":""}"><div class="eyebrow">${mandatory?"Obligatoire avant l'épreuve pratique CACES®":"Recommandé avant l'épreuve pratique"} · ${esc((c.prenom||"")+" "+(c.nom||"").toUpperCase())}</div>
    <div class="row" style="gap:12px;align-items:center;margin-bottom:8px">${photoOf(c)?`<img class="cphoto" src="${photoOf(c).url}" alt="Photo d'identité">`:`<span class="pill warn">Pas de photo : vérifiez la pièce d'identité</span>`}<h2 style="font-size:24px;font-weight:800;text-transform:uppercase;margin:0">Engagement du candidat</h2></div>
    <p class="note" style="margin-top:0">À lire au candidat, puis à lui faire cocher et signer sur la tablette.</p>
    ${CONSENT_ITEMS.map((t,i)=>`<label class="cchk"><input type="checkbox" id="cs_${i}" data-cons="${i}" ${d.items[i]?"checked":""}><span>${esc(t)}</span></label>`).join("")}
    <div class="sigwrap"><div class="row" style="justify-content:space-between"><span class="eyebrow">Signature du candidat</span><button class="btn" data-act="sigclear" style="padding:5px 10px;font-size:12.5px">Effacer</button></div>
      <canvas id="sigpad" width="640" height="200" aria-label="Zone de signature"></canvas></div>
    <div class="row" style="margin-top:12px"><button class="btn pri big" data-act="consentok" ${all?"":"disabled"} style="width:auto;flex:1">Valider l'engagement et démarrer l'épreuve</button>
      ${mandatory?"":`<button class="btn" data-act="consentskip">Continuer sans signature</button>`}</div>
    ${all?"":`<p class="note" style="margin:6px 0 0">Cochez les ${CONSENT_ITEMS.length} engagements puis faites signer.</p>`}</section>`;
}
function initSig(){
  const cv=document.getElementById("sigpad");if(!cv||cv._init)return;cv._init=true;
  const ctx=cv.getContext("2d");ctx.lineWidth=2.6;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#0d1823";
  let draw=false,last=null;const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];};
  cv.addEventListener("pointerdown",e=>{draw=true;last=pos(e);cv.setPointerCapture(e.pointerId);e.preventDefault();});
  cv.addEventListener("pointermove",e=>{if(!draw)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;S.consentDraft.has=true;e.preventDefault();});
  const end=()=>{draw=false;};cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
}

const shortL=l=>String(l).replace(/\s*—.*$/,"").replace(/\s*\((?![^)]*(si équipé|si réglable))[^)]*\)/g,"").trim();
const parenNote=l=>{const m=String(l).match(/\(([^)]*)\)/g);return m?m.map(x=>x.slice(1,-1)).filter(x=>!/si équipé|si réglable/.test(x)).join(" · "):"";};
const ELIMS=[["heurt","Heurt","personne, obstacle ou structure"],["chute","Chute de charge",""],["maitrise","Non-maîtrise de l'engin","comportement dangereux"]];
function elimBlock(c,cat){const p=prat(c,cat),el=p.elim||[];
  return `<div class="elimb ${el.length?"on":""}"><span class="eyebrow">Faits éliminatoires · un seul clic pour tout le test</span>
    <div class="row" style="gap:8px">${ELIMS.map(([k,l,d])=>{const on=el.find(x=>x.k===k);return `<button class="ebtn ${on?"on":""}" data-act="elim" data-k="${k}" aria-pressed="${!!on}" title="${esc(d)}">${on?"✕ ":""}${esc(l)}${on?` <small>${new Date(on.t).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</small>`:""}</button>`}).join("")}</div>
    ${el.length?`<div class="row" style="gap:8px;margin-top:8px;width:100%"><b style="color:var(--bad)">Épreuve arrêtée : candidat éliminé.</b><input id="elimnote" class="inp" data-elimnote="1" value="${esc(p.elimNote||"")}" placeholder="Circonstances (épreuve, manœuvre, conséquences)…" style="flex:1;min-width:200px"></div>`:""}</div>`;}
/* ---------- chronomètre d'épreuve pratique ---------- */
function refMin(c,cat){const u=utOf(c.reco,cat);return u?u*60:null;}
const mmss=ms=>{const t=Math.max(0,Math.floor(ms/1000));return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");};
function chronoBox(c,cat,mini){const p=prat(c,cat),ref=refMin(c,cat),run=p.t0&&!p.t1,el=p.t0?((p.t1?Date.parse(p.t1):Date.now())-Date.parse(p.t0)):0;
  return `<div class="chrono ${mini?"cm":""}" style="grid-column:1/-1"><span class="ctime ${ref&&el>ref*1.3*60000?"over":ref&&el>ref*60000?"warn":""}" id="chrono" data-t0="${p.t0||""}" data-t1="${p.t1||""}" data-ref="${ref||""}">${mmss(el)}</span>
    <span class="note">${ref?(mini?`réf. ${Math.round(ref)}′ · maxi ${Math.round(ref*1.3)}′`:`réf. ${Math.round(ref)} min · maxi ${Math.round(ref*1.3)} min (+30 %)`):"pas de temps de référence"}</span>
    ${!p.t0?`<button class="btn" data-act="chrono" data-v="start">▶ Démarrer le chrono</button>`:run?`<button class="btn" data-act="chrono" data-v="stop">■ Arrêter</button>`:`<button class="btn" data-act="chrono" data-v="resume">▶ Reprendre</button><button class="btn" data-act="chrono" data-v="reset">Remettre à zéro</button>`}</div>`;}
setInterval(()=>{const el=document.getElementById("chrono");if(!el||!el.dataset.t0||el.dataset.t1)return;const ms=Date.now()-Date.parse(el.dataset.t0),ref=Number(el.dataset.ref)||0;el.textContent=mmss(ms);el.classList.toggle("warn",!!ref&&ms>ref*60000&&ms<=ref*1.3*60000);el.classList.toggle("over",!!ref&&ms>ref*1.3*60000);},1000);

S.demandes={};S.centre={secEmail:"",nom:"",ville:""};S.dm=null;S.sigm=null;S.att=null;S.pw=null;S.emDay=null;S.pedSend={t:true,s:true,c:false};S.parcF="tous";
const DOW=["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
const isoD=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dObj=s=>new Date((s||isoD(new Date()))+"T12:00:00");
const addD=(s,n)=>{const d=dObj(s);d.setDate(d.getDate()+n);return isoD(d);};
const isWE=s=>{const w=dObj(s).getDay();return w===0||w===6;};
const mondayOf=s=>{const d=dObj(s),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return isoD(d);};
const dShortFr=s=>{const d=dObj(s);return DOW[d.getDay()]+" "+d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"});};
const dLongFr=s=>dObj(s).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
/* durée indicative de formation (jours ouvrés), modifiable sur chaque personne */
function dureeDefaut(reco,cats,profil){const n=Math.max(1,(cats||[]).length),rec=profil==="recyclage";
  if(reco==="TP")return 1;if(reco==="R485")return rec?1:2;if(reco==="R486")return rec?2:Math.min(4,2+n);return rec?(n>=3?3:2):Math.min(5,2+n);}
function finOuvree(start,n){let d=start,k=1;while(k<n){d=addD(d,1);if(!isWE(d))k++;}return d;}
const nbOuvres=(a,b)=>{if(!a||!b||b<a)return 1;let n=0,d=a;while(d<=b){if(!isWE(d))n++;d=addD(d,1);}return Math.max(1,n);};
const arrOf=c=>c.arrivee||c.dateTest;const depOf=c=>c.depart||c.dateTest;
const presentOn=(c,d)=>!!arrOf(c)&&arrOf(c)<=d&&d<=depOf(c);
const periodTxt=c=>{const a=arrOf(c),b=depOf(c);return a&&b&&a!==b?`du ${frDate(a)} au ${frDate(b)}`:`le ${frDate(a)}`;};

function saveDemande(d){S.demandes[d.id]=d;if(S.db)S.db.collection("demandes").doc(d.id).set(d).catch(()=>setSync("Échec d'enregistrement de la demande"));else LS.set("caces.demandes",S.demandes);}
function saveCentre(){if(S.db)S.db.doc("config/centre").set(S.centre).catch(()=>{});else LS.set("caces.centre",S.centre);}
S.demandes=LS.get("caces.demandes",{})||{};S.centre=Object.assign(S.centre,LS.get("caces.centre",{})||{});
(function waitDb(){if(!S.db)return setTimeout(waitDb,400);
  const busy=()=>{const a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT");};
  S.db.collection("demandes").onSnapshot(snap=>{const n={};snap.docs.forEach(d=>n[d.id]={...d.data(),id:d.id});S.demandes=keepPending("demandes",n,S.demandes);if(!S.quiz&&!S.reg&&!S.sat&&!busy()&&!S.sigm)render();},()=>{});
  S.db.doc("config/centre").onSnapshot(s=>{if(s.exists&&!timers.xc&&!timers.gc){S.centre=Object.assign({secEmail:"",nom:"",ville:""},s.data());if(!S.quiz&&!S.reg&&!S.sat&&!busy()&&!S.sigm)render();}},()=>{});})();

async function xMail(to,subject,body){
  to=[...new Set(to.filter(x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x||"")))];
  if(!to.length)return {ok:false,msg:"Aucune adresse mail valide"};
  if(!S.mcp){try{await navigator.clipboard.writeText(`À : ${to.join(", ")}\nObjet : ${subject}\n\n${body}`);}catch(e){}return {ok:false,msg:"Envoi automatique indisponible : le message est copié, collez-le dans votre messagerie."};}
  try{await S.mcp.callTool("Gmail","send_message",{to,subject,body,includeSignature:true});return {ok:true,msg:"Envoyé à "+to.join(", ")};}
  catch(e){return {ok:false,queued:e&&e.code==="queued",msg:mcpErrText(e)};}
}

async function dmSave(send){
  const v=S.dm,rows=v.rows.filter(r=>r.nom.trim()||r.email.trim());

  if(v.ctype!=="particulier"&&!v.cnom.trim()){toast("Indiquez le nom de l'entreprise ou du centre");return;}
  if(!rows.length){toast("Ajoutez au moins une personne (nom ou mail)");return;}
  if(rows.some(r=>!r.cats.length)){toast("Chaque personne doit avoir au moins une catégorie");return;}
  v.busy=true;v.results=[];render();
  const d={id:"d"+Date.now().toString(36)+rnd(3),createdAt:new Date().toISOString(),by:S.role,ctype:v.ctype,cnom:v.cnom.trim(),ccontact:v.ccontact.trim(),ctel:v.ctel.trim(),cmail:v.cmail.trim(),date:v.date,note:v.note.trim(),cands:[]};
  for(const r of rows){
    const c=newCand(r.reco);const rc=RECOS[r.reco];
    Object.assign(c,{nom:r.nom.trim(),prenom:r.prenom.trim(),email:r.email.trim().toLowerCase(),profil:r.profil,type:rc.caces?r.type:"ACES",cats:sortCats(r.reco,r.cats),arrivee:v.date,depart:r.depart||v.date,dateTest:r.depart||v.date,entreprise:v.ctype==="particulier"?"":d.cnom,demandeId:d.id,statut:"invite",invite:{createdAt:new Date().toISOString(),sentAt:null},formateurId:S.inv.formateurId||defInt("formateur",r.reco),testeurId:S.inv.testeurId||defInt("testeur",r.reco)});
    S.cands[c.id]=c;persist(c);d.cands.push(c.id);
    const res={id:c.id,name:(c.prenom+" "+c.nom.toUpperCase()).trim()||c.email,email:c.email,ok:false,msg:""};
    if(send&&c.email){const m=await xMail([c.email],inviteSubject(c),inviteText(c,""));res.ok=m.ok;res.queued=m.queued;res.msg=m.ok?"Fiche envoyée":m.msg;if(m.ok){c.invite.sentAt=new Date().toISOString();persist(c);}}
    else res.msg=c.email?"Enregistré, fiche non envoyée":"Pas d'adresse : remplir la fiche sur place";
    v.results.push(res);render();
  }
  saveDemande(d);v.busy=false;v.step="done";v.did=d.id;render();
}
