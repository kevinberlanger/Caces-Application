/* =========================================================================
   HORS CONNEXION — copie locale (IndexedDB) + file d'attente des
   enregistrements et des mails, envoyée automatiquement au retour du réseau
   ========================================================================= */
const withTO=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error("délai dépassé")),ms))]);
const IDB={p:null,open(){return this.p||(this.p=new Promise(res=>{try{const r=indexedDB.open("caces-offline",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null);}catch(e){res(null)}}));},
  async get(k){const d=await this.open();if(!d)return null;return new Promise(res=>{try{const q=d.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result===undefined?null:q.result);q.onerror=()=>res(null);}catch(e){res(null)}});},
  async set(k,v){const d=await this.open();if(!d)return false;return new Promise(res=>{try{const t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false);t.onabort=()=>res(false);}catch(e){res(false)}});}};
const OFF={q:[],err:[],busy:false,at:null,sig:"",
  key:o=>(o.path||o.col+"/"+o.id),
  push(o){o.ts=Date.now();o.n=0;const k=this.key(o);
    if(o.k==="upsert"||(o.k==="op"&&o.m==="set"))this.q=this.q.filter(x=>!(x.k!=="mail"&&(x.k==="upsert"||x.m==="set")&&this.key(x)===k));
    this.q.push(o);this.save();netUpd();this.kick();},
  pending(col){const m=new Map();this.q.forEach(x=>{if(x.k!=="mail"&&x.col===col)m.set(x.id,x.m==="delete"?"delete":"write");});return m;},
  save(){IDB.set("outbox",{q:this.q,err:this.err});},
  kick(){clearTimeout(this.t);this.t=setTimeout(()=>this.flush(),300);},
  async exec(o){
    if(o.k==="mail"){if(!S.mcpReal)throw new Error("Gmail indisponible sur cet appareil");await S.mcpReal.callTool("Gmail","send_message",o.args);
      if(o.meta&&o.meta.cid&&S.cands[o.meta.cid]){const c=S.cands[o.meta.cid];c.invite=c.invite||{};c.invite.sentAt=new Date().toISOString();persist(c);}return;}
    const R=S.dbReal;if(!R)throw new Error("Base partagée indisponible");
    if(o.k==="upsert"){const ref=R.collection(o.col).doc(o.id),s=await ref.get();return s.exists?ref.update(o.body):ref.set(o.full);}
    const ref=o.path?R.doc(o.path):R.collection(o.col).doc(o.id);return o.m==="delete"?ref.delete():ref[o.m](o.data);},
  async flush(){
    if(this.busy||!this.q.length||!navigator.onLine)return;this.busy=true;netUpd();
    let dbBlocked=false;
    for(const o of this.q.slice()){
      if(o.k!=="mail"&&dbBlocked)continue;
      try{await withTO(this.exec(o),25000);this.q=this.q.filter(x=>x!==o);this.save();netUpd();}
      catch(e){o.n++;o.lastErr=(e&&(e.message||e.code))||"erreur";
        if(o.n>=6&&navigator.onLine){this.q=this.q.filter(x=>x!==o);this.err.push(o);this.save();}
        else if(o.k!=="mail")dbBlocked=true;
        if(!navigator.onLine)break;}
    }
    this.busy=false;netUpd();if(S.offOpen)render();
    if(this.q.length)setTimeout(()=>this.kick(),15000);}
};
/* --- base partagée : les écritures passent par la file, les lectures retombent sur la copie locale --- */
const LOCALCOL={candidats:()=>S.cands,demandes:()=>S.demandes,intervenants:()=>S.interv,gabarits:()=>S.tpls,sessions:()=>S.sessions};
function fakeSnap(col,f,v,n){const src=(LOCALCOL[col]||(()=>({})))(),L=Object.entries(src).filter(([,x])=>x&&x[f]===v).slice(0,n||999).map(([id,x])=>({id,data:()=>JSON.parse(JSON.stringify(x))}));return {empty:!L.length,size:L.length,docs:L};}
function wrapDoc(o,real){return {set:d=>{OFF.push({...o,k:"op",m:"set",data:JSON.parse(JSON.stringify(d))});return Promise.resolve();},
  update:d=>{OFF.push({...o,k:"op",m:"update",data:JSON.parse(JSON.stringify(d))});return Promise.resolve();},
  delete:()=>{OFF.push({...o,k:"op",m:"delete"});return Promise.resolve();},
  get:()=>withTO(real.get(),8000).catch(()=>{const x=o.col&&(LOCALCOL[o.col]||(()=>({})))()[o.id];return {exists:!!x,id:o.id,data:()=>x};}),
  onSnapshot:(...a)=>real.onSnapshot(...a)};}

  collection:name=>{const rc=real.collection(name);return {doc:id=>wrapDoc({col:name,id},rc.doc(id)),onSnapshot:(...a)=>rc.onSnapshot(...a),

  Object.keys(S).forEach(k=>{if(!BOOT_KEEP.has(k))delete S[k];});
  Object.entries(JSON.parse(JSON.stringify(S0))).forEach(([k,v])=>{if(!BOOT_KEEP.has(k))S[k]=v;});

    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);ch.setUint32(16,crc,true);ch.setUint32(20,d.length,true);ch.setUint32(24,d.length,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+d.length;});
  const cl=cd.reduce((a,x)=>a+x.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cl,true);e.setUint32(16,off,true);

const dataUrlBytes=u=>{const b=atob(String(u).split(",")[1]||""),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;};

const hex=b=>Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,"0")).join("");
async function hmacHex(key,msg){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(key),{name:"HMAC",hash:"SHA-256"},false,["sign"]);return hex(await crypto.subtle.sign("HMAC",k,new TextEncoder().encode(msg)));}
async function gSend(t,event,donnees){const cn=connOf(),u=String(cn[t+"Url"]||"").trim();
  if(!/^https?:\/\/[^\s]+$/i.test(u))return {ok:false,msg:"Renseignez d'abord une adresse (URL) valide."};
  const body=JSON.stringify({format:FMT.export+".evenement",version:FMT.version,evenement:event,envoyeLe:new Date().toISOString(),structure:{nom:strNom(),type:strType()},donnees}),key=keyOfT(t),h={"Content-Type":"application/json","X-Caces-Event":event};
  if(key){try{h["X-Caces-Signature"]="sha256="+await hmacHex(key,body);}catch(e){}}
  try{const r=await withTO(fetch(u,{method:"POST",headers:h,body}),12000);return {ok:r.ok,msg:r.ok?"Reçu par le serveur (réponse "+r.status+")":"Le serveur a répondu "+r.status};}
  catch(e){return {ok:false,msg:"Envoi impossible depuis cette page (les pages hébergées sur Claude bloquent en général les appels vers un serveur externe, ou le serveur refuse l'origine). L'application installée n'aura pas cette limite. Détail : "+(e&&e.message||e)};}}

    corps:{format:FMT.export+".evenement",version:FMT.version,evenement:"voir evenements",envoyeLe:"ISO 8601",structure:{nom:"",type:""},donnees:"dossier candidat (format "+FMT.dossier+") ou liste de dossiers"},

.ok{color:#15803d;font-weight:700}.ko{color:#b91c1c;font-weight:700}.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid #888}.pill.ok{background:#dcfce7;border-color:#15803d}.pill.ko{background:#fee2e2;border-color:#b91c1c}
.ft{margin-top:18px;border-top:1px solid #bbb;padding-top:6px;font-size:10px;color:#666}.np{margin:0 0 12px;padding:8px 14px;font-size:13px;cursor:pointer}@media print{.np{display:none}body{padding:0}}`;
function docShell(title,body,c){const b=brandOf(c),ref=c?`${c.reco} · ${(c.nom||"").toUpperCase()} ${c.prenom||""}`:"";
  return `<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}${ref?" — "+esc(ref):""}</title><style>${DOC_CSS}${brandCss(b)}</style></head><body>
<button class="np" onclick="print()">Imprimer / Enregistrer en PDF</button>
${brandHead(b,title)}${body}
<div class="ft"><span><b>${esc(b.nom||strNom()||"")}</b>${b.foot?" · "+esc(b.foot):""}${strOrg()?" · organisme testeur : "+esc(strOrg()):""}</span><span>${c?"Dossier "+esc(c.code||""):""}</span></div></body></html>`;}
const fld=(l,v,w)=>`<div class="fl" style="flex:${w||1}"><span class="lb">${esc(l)}</span><span class="vl">${v?esc(v):"&nbsp;"}</span></div>`;
const nomComplet=c=>`${(c.nom||"").toUpperCase()} ${c.prenom||""}`.trim();

function attestHtml(c,part){const P=ped(c),v=P.val[part];if(!v)return null;const rc=RECOS[c.reco],theo=part==="theo",pg=pedProg(c,theo?"theo":part);
  return docShell("Attestation de fin de formation",`<h1 class="c">Attestation de fin de formation</h1><p class="c">${theo?"Partie théorique":"Partie pratique — catégorie "+esc(part)}</p>
  <p class="c" style="margin-top:18px">${esc(strNom()||"La structure organisatrice")} atteste que</p><div class="big">${esc(nomComplet(c))}</div>
  <p class="c">${c.naissance?"né(e) le "+frDate(c.naissance):""}${c.entreprise?" · "+esc(c.entreprise):""}</p>
  <p class="c" style="margin-top:14px">a suivi la formation<br><b>${esc(rc.label)} — ${esc(rc.name)}</b>${theo?"":"<br>catégorie "+esc(part)+" : "+esc(catLabel(c.reco,part))}<br>${esc(periodTxt(c))}.</p>
  <p class="c">Évaluation des acquis : <b>${pg.x} / ${pg.n}</b> objectifs acquis.</p>
  <div class="sig"><div>Fait à ${esc(S.centre.ville||"…………")}, le ${new Date(v.at).toLocaleDateString("fr-FR")}<br>Le formateur : <b>${esc(v.fname||"")}</b>${v.sig?`<img src="${v.sig}" alt="Signature">`:""}</div><div>Cachet de la structure</div></div>
  <p class="note" style="margin-top:12px">Cette attestation ne vaut ni CACES®, ni autorisation de conduite.</p>`,c);}

function suiviHtml(c){const P=ped(c),R=pedRows(c),pr=pedProg(c);let g="";const sym=["","/","✕"];
  const rows=R.map(r=>{const h=r.gl!==g?(g=r.gl,`<tr><th colspan="3">${esc(g)}</th></tr>`):"";const v=P.m[r.k]||0;return h+`<tr><td style="width:26px"><span class="nb">${sym[v]}</span></td><td>${r.num?esc(r.num)+". ":""}${esc(r.l)}</td><td style="width:34%">${esc(P.n[r.k]||"")}</td></tr>`;}).join("");
  return docShell("Fiche de suivi pédagogique",`<h1>Suivi pédagogique</h1><p><b>${esc(nomComplet(c))}</b> · ${esc(RECOS[c.reco].label)} cat. ${esc(c.cats.join(", "))} · ${c.type==="CACES"?"CACES®":"ACES"} · ${c.profil==="recyclage"?"recyclage":"formation initiale"} · ${esc(periodTxt(c))}</p>
  <p class="note">Légende : <span class="nb"></span> à faire · <span class="nb">/</span> abordé, à consolider · <span class="nb">✕</span> acquis. Formateur : ${esc(intName(intById(c.formateurId))||"—")}</p>
  <table><thead><tr><th></th><th>Objectif</th><th>Annotation</th></tr></thead><tbody>${rows}</tbody></table>
  <p><b>Avancement :</b> ${pr.x}/${pr.n} acquis · ${pr.t} à consolider · ${pr.n-pr.x} restant(s)</p>
  ${P.pb?`<h2>Problématiques signalées</h2><p>${esc(P.pb)}</p>`:""}${P.gen?`<h2>Observations du formateur</h2><p>${esc(P.gen)}</p>`:""}
  <h2>Validation de la formation</h2><p>Théorie : ${P.val.theo?"validée le "+new Date(P.val.theo.at).toLocaleDateString("fr-FR")+(P.val.theo.fname?" par "+esc(P.val.theo.fname):""):"non validée"}<br>${c.cats.map(k=>`Pratique cat. ${esc(k)} : ${P.val[k]?"validée le "+new Date(P.val[k].at).toLocaleDateString("fr-FR"):"non validée"}`).join("<br>")}</p>`,c);}

function resultatsHtml(c){const t=scoreTheo(c),rc=RECOS[c.reco];
  const tb=x=>`<table><thead><tr><th>Thème</th><th style="width:90px">Points</th><th style="width:60px"></th></tr></thead><tbody>${x.map(y=>`<tr><td>${esc(y.name)}</td><td>${fmt(y.s)} / ${fmt(y.m)}</td><td class="${y.ok?"ok":"ko"}">${y.ok?"✓":"✗"}</td></tr>`).join("")}</tbody></table>`;
  const pr=c.cats.map(k=>{const p=(c.prat||{})[k]||{},r=scorePrat(c,k);return `<h2>Pratique — catégorie ${esc(k)} : ${esc(catLabel(c.reco,k))}</h2>${!p.t0?"<p>Non passée.</p>":`<p><b>${fmt(r.tot)} / ${fmt(r.max)}</b> (${fmt(r.pct)} %) — <span class="${r.ok?"ok":"ko"}">${r.ok?"RÉUSSIE":r.elim?"ÉLIMINÉ":"NON RÉUSSIE"}</span>${!p.t1&&!r.elim?" (test non clôturé)":""}</p>${tb(r.themes)}${r.zeroPts.length?`<p class="note">Points d'évaluation à 0 : ${esc(r.zeroPts.join(", "))}</p>`:""}${p.obs&&p.obs._fin?`<p class="note">Observations : ${esc(p.obs._fin)}</p>`:""}`}`;}).join("");
  const dec=c.cats.map(k=>{const d=decisionOf(c,k),lab={avis_favorable:"Avis favorable — autorisation de conduite à établir",avis_defavorable:"Avis défavorable — à reprogrammer",caces_a_delivrer:"CACES® à éditer et remettre",non_obtenu:"CACES® non obtenu (bénéfice de la partie réussie conservé 12 mois)",en_attente:"En attente"}[d];return `<tr><td>${esc(rc.label)} cat. ${esc(k)}</td><td><span class="pill ${/favorable$|delivrer|à éditer/.test(d)&&!/defav/.test(d)?"ok":d==="en_attente"?"":"ko"}">${esc(lab)}</span></td></tr>`;}).join("");
  return docShell("Résultats des tests",`<h1>Résultats des tests</h1><div class="row">${fld("Nom",nomComplet(c),2)}${fld("Naissance",frDate(c.naissance))}${fld("Entreprise",c.entreprise,2)}</div><div class="row">${fld("Formation",rc.label+" — "+rc.name,2)}${fld("Session",periodTxt(c))}${fld("Type",c.type==="CACES"?"CACES®":"ACES")}</div>
  <div class="row">${fld("Formateur",intName(intById(c.formateurId)))}${fld("Testeur",intName(intById(c.testeurId))||c.testeur)}</div>
  <h2>Théorie</h2>${t?`<p><b>${t.s} / ${t.m}</b> (${fmt(t.pct)} %) — <span class="${t.ok?"ok":"ko"}">${t.ok?"RÉUSSIE":"NON RÉUSSIE"}</span>${t.validated?"":" (non encore validée par le testeur)"}</p>${tb(t.themes)}`:"<p>Non passée.</p>"}${pr}
  <h2>Décision</h2><table><tbody>${dec}</tbody></table><p class="note">Critères : au moins 70 % du total et au moins la moyenne dans chaque thème ; aucun point d'évaluation pratique à 0.</p>`,c);}

/* autorisation de conduite : remplie automatiquement à partir des résultats, il ne reste qu'à signer */
const validiteAns=()=>{const n=parseInt(S.centre.validiteAns,10);return n>0&&n<=10?n:5;};
const addYears=(iso,n)=>{const d=new Date((iso||isoD(new Date()))+"T00:00:00");d.setFullYear(d.getFullYear()+n);return isoD(d);};
const favCats=c=>c.cats.filter(k=>["avis_favorable","caces_a_delivrer"].includes(decisionOf(c,k)));
function autoHtml(c){const F=favCats(c);if(!F.length)return null;const i=c.insc||{},emp=i.employeur||entFind(c.entreprise)||{},rc=RECOS[c.reco],P=ped(c),te=intById(c.testeurId);
  const last=c.cats.map(k=>((c.prat||{})[k]||{}).t1).filter(Boolean).sort().pop(),dEval=(last||c.updated||new Date().toISOString()).slice(0,10),fin=addYears(dEval,validiteAns());
  const medOk=i.attestMed==="oui",ph=c.photo&&c.photo.url?`<img src="${c.photo.url}" alt="Photo">`:`<span>Photo<br>d'identité</span>`;
  const fv=P.val.theo||P.val[F[0]]||{};
  return docShell("Autorisation de conduite",`<div style="display:flex;gap:14px;align-items:flex-start"><div style="flex:1"><h1>Autorisation de conduite</h1><p class="note">Établie par l'employeur en application des articles R. 4323-55 et R. 4323-56 du Code du travail.</p></div><div class="ph">${ph}</div></div>
  <h2>Employeur</h2><div class="row">${fld("Entreprise",c.entreprise,2)}${fld("SIRET",emp.siret)}</div><div class="row">${fld("Adresse",emp.adr,2)}</div>
  <h2>Salarié autorisé</h2><div class="row">${fld("Nom",nomComplet(c),2)}${fld("Date de naissance",frDate(c.naissance))}</div><div class="row">${fld("Poste occupé",i.poste,2)}${fld("Identifiant dossier",c.code)}</div>
  <h2>Équipements de travail pour lesquels la conduite est autorisée</h2>
  <table><thead><tr><th>Recommandation</th><th>Catégorie / équipement</th><th style="width:150px">N° d'autorisation${c.type==="CACES"?" · N° CACES®":""}</th><th style="width:90px">Évaluation du</th><th style="width:90px">Valable jusqu'au</th></tr></thead><tbody>${F.map(k=>`<tr><td>${esc(rc.label)} — ${esc(rc.name)}</td><td><b>${esc(k)}</b> · ${esc(catLabel(c.reco,k))}</td><td><b>${esc(autNum(c,k))}</b>${c.type==="CACES"?"<br>"+(cacesNum(c,k)?"CACES® n° "+esc(cacesNum(c,k)):"CACES® n° ……………"):""}</td><td>${frDate(dEval)}</td><td>${frDate(fin)}</td></tr>`).join("")}</tbody></table>
  <h2>Éléments pris en compte pour la délivrance</h2>
  <p>${medOk?"☒":"☐"} <b>Aptitude médicale</b> : attestation du médecin du travail d'absence de contre-indication à la conduite${medOk?" (déclarée fournie)":" — <b>à fournir ou à vérifier avant signature</b>"}.</p>
  <p>☒ <b>Contrôle des connaissances et du savoir-faire</b> pour la conduite en sécurité : ${esc(rc.label)}, théorie ${(()=>{const t=scoreTheo(c);return t?fmt(t.pct)+" %":"—";})()} et pratique réussies, formation validée${fv.fname?" par "+esc(fv.fname):""}${te?", évaluation par "+esc(intName(te)):""}${c.type==="CACES"?" ; CACES® n° …………… (à compléter)":""}.</p>
  <p>☐ <b>Connaissance des lieux et des instructions à respecter</b> sur le(s) site(s) d'utilisation : à valider par l'employeur (visite du site, consignes de circulation, protocole de chargement/déchargement).</p>
  <p class="note">Cette autorisation est personnelle. Elle peut être retirée ou suspendue à tout moment si les conditions ne sont plus remplies (comportement dangereux, inaptitude médicale, changement de site ou d'équipement). Elle doit pouvoir être présentée sur demande de l'inspection du travail. Le salarié la conserve sur lui pendant la conduite.</p>
  <div class="sig"><div>Fait à ${esc(S.centre.ville||"…………")}, le …… / …… / ……<br><b>L'employeur</b><br>${esc(emp.sg||"Nom, fonction : ……………………")}<br><br>Signature et cachet</div><div>Le salarié, <b>${esc(nomComplet(c))}</b><br>Lu et pris connaissance<br><br>Signature</div></div>`,c);}

/* registre des documents disponibles pour une personne */
function docsOf(c){const L=[],P=ped(c),t=scoreTheo(c),nowIso=new Date().toISOString();
  if(c.insc&&c.insc.certifieLe)L.push({id:"fiche",label:"Fiche de renseignements",at:c.insc.certifieLe,auto:true,build:()=>ficheHtml(c)});
  Object.entries(P.val).forEach(([k,v])=>L.push({id:"attest-"+k,label:k==="theo"?"Attestation théorie":"Attestation pratique "+k,at:v.at,auto:true,build:()=>attestHtml(c,k)}));
  if(pedProg(c).x||P.pb||P.gen)L.push({id:"suivi",label:"Suivi pédagogique",at:c.updated||nowIso,auto:false,build:()=>suiviHtml(c)});
  const done=c.cats.filter(k=>{const p=(c.prat||{})[k]||{};return p.t1||(p.elim||[]).length;});
  if(t||done.length)L.push({id:"resultats",label:"Résultats des tests",at:(done.map(k=>c.prat[k].t1).filter(Boolean).sort().pop())||c.updated||nowIso,auto:!!t&&t.validated&&done.length===c.cats.length,build:()=>resultatsHtml(c)});
  if(favCats(c).length)L.push({id:"autorisation",label:"Autorisation de conduite (à signer)",at:(done.map(k=>c.prat[k].t1).filter(Boolean).sort().pop())||c.updated||nowIso,auto:true,build:()=>autoHtml(c)});
  return L;}

/* ---------- PDF (bibliothèque chargée à la demande ; repli : fichier HTML) ---------- */
let _h2p=null;
function loadH2P(){if(window.html2pdf)return Promise.resolve(window.html2pdf);if(_h2p)return _h2p;
  _h2p=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";s.onload=()=>window.html2pdf?res(window.html2pdf):rej(new Error("PDF indisponible"));s.onerror=()=>{_h2p=null;rej(new Error("bibliothèque PDF indisponible (hors connexion ?)"));};document.head.appendChild(s);});return _h2p;}
async function htmlToPdf(html){const h=await withTO(loadH2P(),20000);const fr=document.createElement("iframe");fr.style.cssText="position:fixed;left:-9999px;top:0;width:794px;height:1123px;border:0";document.body.appendChild(fr);
  try{await new Promise(r=>{fr.onload=r;fr.srcdoc=html;});await new Promise(r=>setTimeout(r,1100));const d=fr.contentDocument;try{await d.fonts.ready;}catch(e){}d.querySelectorAll(".np").forEach(x=>x.remove());
    return await h().set({margin:[6,6,6,6],image:{type:"jpeg",quality:0.93},html2canvas:{scale:2,useCORS:true,windowWidth:794},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:["css","legacy"],avoid:["tr",".sig"]}}).from(d.body).outputPdf("blob");}
  finally{fr.remove();}}
async function docFile(c,d){const html=d.build();if(!html)return null;const base=`${d.id}-${candSlug(c)}`;
  try{const b=await htmlToPdf(html);return {name:base+".pdf",blob:b,mime:"application/pdf",pdf:true};}catch(e){return {name:base+".html",blob:new Blob([html],{type:"text/html"}),mime:"text/html",pdf:false,why:e&&e.message};}}
const blobB64=async b=>{const u=new Uint8Array(await b.arrayBuffer());let o="";for(let i=0;i<u.length;i+=0x8000)o+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(o);};
const okMail=x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x),splitMail=v=>String(v||"").split(/[\s,;]+/).filter(okMail);
const docDests=()=>splitMail(S.centre.docMail||S.centre.secEmail);const docDest=()=>docDests().join(", ");
const personMails=c=>[c&&c.formateurId,c&&c.testeurId].map(id=>S.interv[id]).filter(x=>x&&x.mine!==false&&okMail(x.email)).map(x=>x.email.trim());
const docDestsFor=c=>[...new Set([...docDests(),...splitMail((entFind(c&&c.entreprise)||{}).mail),...personMails(c)])];
S.me=S.me||{email:(function(){try{return localStorage.getItem("caces.myemail")||""}catch(e){return ""}})(),src:""};
const myInterv=()=>{const m=(S.me.email||"").trim().toLowerCase();return m?intList().find(x=>(x.email||"").trim().toLowerCase()===m)||null:null;};
(async()=>{try{const u=window.claude&&await window.claude.use("user");const p=u&&await u.me();if(p&&p.email){S.me.email=p.email;S.me.src="login";if(!S.quiz&&!S.reg)render();}}catch(e){}})();
async function mailDoc(to,c,d){if(!S.mcp)return {ok:false,msg:"Gmail indisponible ici"};const f=await docFile(c,d);if(!f)return {ok:false,msg:"Document vide"};
  try{await S.mcp.callTool("Gmail","send_message",{to:Array.isArray(to)?to:[to],subject:`${strNom()?"["+strNom()+"] ":""}${d.label} — ${nomComplet(c)} — ${periodTxt(c)}`,body:`Bonjour,\n\nVeuillez trouver en pièce jointe : ${d.label}\n${nomComplet(c)} · ${RECOS[c.reco].label} cat. ${c.cats.join(", ")} · ${periodTxt(c)}.\n${f.pdf?"":"(Format HTML : ouvrir puis imprimer en PDF.)\n"}\nCe document est aussi consultable dans le banc d'évaluation, onglet Documents, à la date de session.\n\nCordialement,`,includeSignature:true,attachments:[{content:await blobB64(f.blob),filename:f.name,mimeType:f.mime}]});return {ok:true,msg:"Envoyé à "+to+(f.pdf?" (PDF)":" (HTML : PDF indisponible)")};}
  catch(e){return {ok:false,queued:e&&e.code==="queued",msg:mcpErrText(e)};}}
/* envoi automatique : chaque document validé part en PDF vers la boîte configurée, une seule fois (c.docSent) */
async function autoScan(){if(autoScan.b)return;const C=S.centre;if(!C.autoMail||!docDests().length||!S.mcp||!navigator.onLine||S.quiz||S.reg||S.sat||!SPACES[S.role])return;
  autoScan.b=true;try{let n=0;for(const c of Object.values(S.cands)){if(c.id==="exemple")continue;for(const d of docsOf(c)){const key=c.id+"|"+d.id;if(!d.auto||(c.docSent||{})[d.id]||autoScan.done.has(key)||String(d.at||"")<(C.autoSince||"9999"))continue;
    const r=await mailDoc(docDestsFor(c),c,d);if(r.ok){autoScan.done.add(key);const cur=S.cands[c.id]||c;cur.docSent=Object.assign({},cur.docSent,c.docSent||{});cur.docSent[d.id]=new Date().toISOString();persist(cur);toast("Envoyé automatiquement : "+d.label+" — "+nomComplet(c));}else{if(!r.queued)toast("Envoi automatique en échec : "+r.msg,true);return;}
    if(++n>=3)return;}}}finally{autoScan.b=false;}}
autoScan.done=new Set();
setInterval(()=>{autoScan().catch(()=>{});},30000);

/* ---------- aperçu ---------- */
function docClose(){const o=document.getElementById("docov");if(o)o.remove();}
function docOpen(cid,did){const c=S.cands[cid];if(!c)return;const d=docsOf(c).find(x=>x.id===did);if(!d)return;const html=d.build();if(!html)return;docClose();
  const o=document.createElement("div");o.id="docov";o.className="xov";o.setAttribute("role","dialog");o.setAttribute("aria-modal","true");o.dataset.cid=cid;o.dataset.did=did;
  o.innerHTML=`<div class="xmod" style="width:min(920px,96vw);max-height:94vh;display:flex;flex-direction:column"><div class="xmh"><div><div class="eyebrow">${esc(nomComplet(c))}</div><h2>${esc(d.label)}</h2></div><button class="btn" data-dact="close">Fermer</button></div>
  <div style="flex:1;min-height:0;padding:0 14px"><iframe style="width:100%;height:64vh;border:1px solid var(--line);border-radius:8px;background:#fff" sandbox="allow-same-origin" srcdoc="${esc(html)}"></iframe></div>
  <div class="xmf" style="gap:8px;flex-wrap:wrap"><button class="btn pri" data-dact="pdf">Télécharger en PDF</button><button class="btn" data-dact="html">Télécharger en HTML</button><input type="email" id="docto" value="${esc(docDestsFor(c).join(", "))}" placeholder="adresses mail, séparées par une virgule" style="flex:1;min-width:180px"><button class="btn" data-dact="mail">Envoyer par mail (PDF)</button></div></div>`;
  document.body.appendChild(o);}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-dact]");if(!b)return;const o=document.getElementById("docov");if(!o)return;const c=S.cands[o.dataset.cid];const d=c&&docsOf(c).find(x=>x.id===o.dataset.did);if(!d){docClose();return;}
  const k=b.dataset.dact;if(k==="close"){docClose();return;}
  if(k==="html"){const h=d.build();await gSave(`${d.id}-${candSlug(c)}.html`,new Blob([h],{type:"text/html"}),"text/html");return;}
  b.disabled=true;const t0=b.textContent;b.textContent="Préparation…";
  try{if(k==="pdf"){const f=await docFile(c,d);if(f&&!f.pdf)toast("PDF indisponible ici ("+(f.why||"hors connexion")+") : fichier HTML fourni",true);if(f)await gSave(f.name,f.blob,f.mime);}
    else if(k==="mail"){const to=splitMail((document.getElementById("docto")||{}).value);if(!to.length){toast("Adresse mail invalide",true);}else{const r=await mailDoc(to,c,d);toast(r.msg,!r.ok&&!r.queued);}}}
  finally{b.disabled=false;b.textContent=t0;}},true);

/* ---------- onglet Documents : consultation par date de session ---------- */
S.dv={date:""};
const docDates=()=>[...new Set(Object.values(S.cands).filter(c=>c.id!=="exemple"&&arrOf(c)).map(c=>arrOf(c)))].sort().reverse();
function viewDocuments(){const C=S.centre,dates=docDates(),v=S.dv=S.dv||{date:""};if(!v.date||(v.date!=="tous"&&!dates.includes(v.date)))v.date=dates.find(d=>d<=isoD(new Date()))||dates[0]||"tous";

/* numéro d'autorisation (ACES) généré, numéro de CACES® saisi, un par catégorie */
const nums=(c,k)=>((c.nums||{})[k])||{};
const autNum=(c,k)=>nums(c,k).aut||`ACES-${(arrOf(c)||isoD(new Date())).slice(0,4)}-${(c.code||"").toUpperCase()}-${k}`;
const cacesNum=(c,k)=>nums(c,k).caces||"";
function setNum(cid,k,f,v){const c=S.cands[cid];if(!c)return;c.nums=c.nums||{};c.nums[k]=Object.assign({},c.nums[k]);c.nums[k][f]=v.trim();clearTimeout(timers["n"+cid]);timers["n"+cid]=setTimeout(()=>{delete timers["n"+cid];persist(c);},800);}

/* test théorique : synthèse + question par question (mode QCM) */
function testTheoHtml(c){const t=scoreTheo(c);if(!t)return null;const rc=RECOS[c.reco],bank=BANK[bankKey(c)],q=c.theo&&c.theo.qcm,tb=t.themes.map(x=>`<tr><td>${esc(x.name)}</td><td style="width:90px">${fmt(x.s)} / ${fmt(x.m)}</td><td class="${x.ok?"ok":"ko"}" style="width:50px">${x.ok?"✓":"✗"}</td></tr>`).join("");
  const det=q&&q.bits&&q.bits.length===bank.length?`<h2>Détail des réponses</h2><table><thead><tr><th style="width:28px">N°</th><th>Question</th><th style="width:62px">Attendu</th><th style="width:62px">Stagiaire</th><th style="width:30px"></th></tr></thead><tbody>${bank.map((x,i)=>{const okk=q.bits[i]==="1",att=x.a?"Vrai":"Faux",rep=okk?att:(x.a?"Faux":"Vrai");return `<tr><td>${i+1}</td><td>${esc(x.q)}${okk||!x.w?"":`<div class="note">${esc(x.w)}</div>`}</td><td>${att}</td><td>${rep}</td><td class="${okk?"ok":"ko"}">${okk?"✓":"✗"}</td></tr>`;}).join("")}</tbody></table>`:`<p class="note">Saisie par thème (pas de détail question par question).</p>`;
  return docShell("Test théorique",`<h1>Test théorique</h1><div class="row">${fld("Nom",nomComplet(c),2)}${fld("Naissance",frDate(c.naissance))}${fld("Entreprise",c.entreprise,2)}</div><div class="row">${fld("Formation",rc.label+" — "+rc.name,2)}${fld("Session",periodTxt(c))}${fld("Testeur",intName(intById(c.testeurId))||c.testeur)}</div>
  <h2>Résultat</h2><p><b>${t.s} / ${t.m}</b> (${fmt(t.pct)} %) — <span class="${t.ok?"ok":"ko"}">${t.ok?"RÉUSSI":"NON RÉUSSI"}</span>${t.validated?"":" (non encore validé par le testeur)"}</p><table><thead><tr><th>Thème</th><th>Points</th><th></th></tr></thead><tbody>${tb}</tbody></table>${det}`,c);}

/* test pratique : grille complète d'une catégorie, critère par critère */
function testPratHtml(c,k){const p=(c.prat||{})[k];if(!p||!p.t0)return null;const rc=RECOS[c.reco],r=scorePrat(c,k),g=getGrid(c.reco,k);
  const body=g.map(t=>{const pts=t.points.filter(pt=>!(isAces(c)&&p.off&&p.off[pt.id])).map(pt=>{const ac=activeCrits(c,k,pt);if(!ac.length)return "";const s=pointScore(c,k,pt),m=ac.reduce((a,x)=>a+x.max,0);
      return `<tr><td style="width:38px"><b>${esc(pt.num)}</b></td><td>${esc(pt.label)}${ac.length>1?`<div class="note">${ac.map(cr=>esc(cr.label)+" ("+fmt(critScore(c,k,cr))+"/"+cr.max+")").join(" · ")}</div>`:""}</td><td style="width:70px" class="${s<=0?"ko":""}">${fmt(s)} / ${fmt(m)}</td></tr>`;}).join("");
    const th=r.themes.find(x=>x.name===t.name)||{s:0,m:0};return `<h2>${esc(t.name)} — ${fmt(th.s)} / ${fmt(th.m)}</h2><table><tbody>${pts}</tbody></table>`;}).join("");
  return docShell("Test pratique — catégorie "+k,`<h1>Test pratique · catégorie ${esc(k)}</h1><p class="note">${esc(catLabel(c.reco,k))}</p><div class="row">${fld("Nom",nomComplet(c),2)}${fld("Naissance",frDate(c.naissance))}${fld("Entreprise",c.entreprise,2)}</div><div class="row">${fld("Formation",rc.label+" — "+rc.name,2)}${fld("Session",periodTxt(c))}${fld("Testeur",intName(intById(c.testeurId))||c.testeur)}</div>
  <h2>Résultat</h2><p><b>${fmt(r.tot)} / ${fmt(r.max)}</b> (${fmt(r.pct)} %) — <span class="${r.ok?"ok":"ko"}">${r.ok?"RÉUSSI":r.elim?"ÉLIMINÉ":"NON RÉUSSI"}</span>${!p.t1&&!r.elim?" (test non clôturé)":""}</p>${r.zeroPts.length?`<p class="note">Points d'évaluation à 0 : ${esc(r.zeroPts.join(", "))}</p>`:""}${body}${p.obs&&p.obs._fin?`<h2>Observations du testeur</h2><p>${esc(p.obs._fin)}</p>`:""}`,c);}

/* ---------- registre : ajout des tests, des numéros ---------- */
const _docsOf0=docsOf;
docsOf=function(c){const L=_docsOf0(c),t=scoreTheo(c);
  if(t)L.splice(L.findIndex(d=>d.id==="resultats")>=0?L.findIndex(d=>d.id==="resultats"):L.length,0,{id:"test-theo",label:"Test théorique",at:(c.theo&&c.theo.qcm&&c.theo.qcm.date)||c.updated||new Date().toISOString(),auto:!!t.validated,build:()=>testTheoHtml(c)});
  c.cats.forEach(k=>{const p=(c.prat||{})[k]||{};if(p.t0)L.push({id:"test-prat-"+k,label:"Test pratique "+k,at:p.t1||c.updated||new Date().toISOString(),auto:!!(p.t1||(p.elim||[]).length),build:()=>testPratHtml(c,k)});});
  return L;};

const STAG_DEF={fiche:false,attest:true,tests:true,resultats:true,autorisation:false,suivi:true};
const STAG_LAB=[["fiche","Fiche de renseignements"],["attest","Attestations"],["tests","Tests théorique et pratique"],["resultats","Résultats"],["autorisation","Autorisation de conduite"],["suivi","Suivi pédagogique"]];

async function mailDoc(to,c,d,who){if(!S.mcp)return {ok:false,msg:"Gmail indisponible ici"};const f=await docFile(c,d);if(!f)return {ok:false,msg:"Document vide"};const st=who==="stagiaire";
  try{await S.mcp.callTool("Gmail","send_message",{to:Array.isArray(to)?to:[to],subject:st?`${strNom()?"["+strNom()+"] ":""}Votre document — ${d.label} — ${periodTxt(c)}`:`${strNom()?"["+strNom()+"] ":""}${d.label} — ${nomComplet(c)} — ${periodTxt(c)}`,
    body:st?`Bonjour ${c.prenom||""},\n\nVous trouverez en pièce jointe votre document : ${d.label}\n${RECOS[c.reco].label} · ${periodTxt(c)}.\n\nConservez-le : il peut vous être demandé.\n\nCordialement,`:`Bonjour,\n\nVeuillez trouver en pièce jointe : ${d.label}\n${nomComplet(c)} · ${RECOS[c.reco].label} cat. ${c.cats.join(", ")} · ${periodTxt(c)}.\n${f.pdf?"":"(Format HTML : ouvrir puis imprimer en PDF.)\n"}\nCe document est aussi consultable dans le banc d'évaluation, onglet Documents, à la date de session.\n\nCordialement,`,includeSignature:true,attachments:[{content:await blobB64(f.blob),filename:f.name,mimeType:f.mime}]});
    return {ok:true,msg:"Envoyé à "+(Array.isArray(to)?to.join(", "):to)+(f.pdf?" (PDF)":" (HTML : PDF indisponible)")};}
  catch(e){return {ok:false,queued:e&&e.code==="queued",msg:mcpErrText(e)};}}

/* ---------- Drive : un dossier par entreprise, un sous-dossier par date de session ---------- */
const driveRootOf=c=>(entFind(c&&c.entreprise)||{}).drive||S.centre.driveRoot||"";
const idOfRes=r=>{try{const x=r&&(r.structuredContent||r.payload||r);if(x&&x.id)return x.id;const t=r&&r.content&&r.content[0]&&r.content[0].text;if(t){const j=JSON.parse(t);return j.id||(j.file&&j.file.id)||"";}}catch(e){}return "";};
async function driveFolder(parent,name){const C=S.centre;C.driveF=C.driveF||{};const k=parent+"|"+name;if(C.driveF[k])return C.driveF[k];
  const r=await S.mcp.callTool("Google Drive","create_file",{title:name,mimeType:"application/vnd.google-apps.folder",parentId:parent});const id=idOfRes(r);if(!id)throw new Error("dossier Drive non créé");C.driveF[k]=id;saveCentre();return id;}
async function driveSave(c,d,f){const root=driveRootOf(c);if(!root)return {ok:false,skip:true,msg:"Pas de dossier Drive défini"};if(!S.mcp)return {ok:false,msg:"Drive indisponible ici"};
  try{const sub=await driveFolder(root,"Session "+(arrOf(c)||"sans-date")),pr=await driveFolder(sub,nomComplet(c));
    await S.mcp.callTool("Google Drive","create_file",{title:f.name,base64Content:await blobB64(f.blob),contentMimeType:f.mime,disableConversionToGoogleType:true,parentId:pr});return {ok:true,msg:"Déposé dans le Drive"};}
  catch(e){return {ok:false,msg:"Drive : "+(e&&(e.message||e.code)||e)};}}

/* ---------- envoi automatique : équipe + stagiaire + Drive, chacun une seule fois ---------- */
async function autoScan(){if(autoScan.b)return;const C=S.centre;if(!C.autoMail||!S.mcp||!navigator.onLine||S.quiz||S.reg||S.sat||!SPACES[S.role])return;
  autoScan.b=true;try{let n=0;const mark=(c,key)=>{autoScan.done.add(c.id+"|"+key);const cur=S.cands[c.id]||c;cur.docSent=Object.assign({},cur.docSent,c.docSent||{});cur.docSent[key]=new Date().toISOString();persist(cur);};
    for(const c of Object.values(S.cands)){if(c.id==="exemple")continue;{const mi=myInterv();if(mi&&mi.mine!==false&&c.formateurId!==mi.id&&c.testeurId!==mi.id)continue;}for(const d of docsOf(c)){if(!d.auto||String(d.at||"")<(C.autoSince||"9999"))continue;
      const sent=k=>(c.docSent||{})[k]||autoScan.done.has(c.id+"|"+k),team=docDestsFor(c),stm=splitMail(c.email);
      if(team.length&&!sent(d.id)){const r=await mailDoc(team,c,d,"equipe");if(r.ok){mark(c,d.id);toast("Équipe : "+d.label+" — "+nomComplet(c));}else{if(!r.queued)toast("Envoi automatique en échec : "+r.msg,true);return;}if(++n>=3)return;}
      if(toStag(d)&&stm.length&&!sent(d.id+"@s")){const r=await mailDoc(stm,c,d,"stagiaire");if(r.ok){mark(c,d.id+"@s");toast("Stagiaire : "+d.label+" — "+nomComplet(c));}else{if(!r.queued)toast("Envoi au stagiaire en échec : "+r.msg,true);return;}if(++n>=3)return;}
      if(driveRootOf(c)&&!sent(d.id+"@d")){const f=await docFile(c,d),r=f?await driveSave(c,d,f):{ok:false};if(r.ok){mark(c,d.id+"@d");toast("Drive : "+d.label+" — "+nomComplet(c));}else if(!r.skip){autoScan.done.add(c.id+"|"+d.id+"@d");toast(r.msg||"Drive indisponible",true);}if(++n>=3)return;}}}}
  finally{autoScan.b=false;}}

function ficheCheck(c){const e=[],w=[],i=c.insc||{};
  const em=x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x||"");
  if(!(c.nom||"").trim())e.push("nom manquant");if(!(c.prenom||"").trim())e.push("prénom manquant");
  if(!c.naissance)e.push("date de naissance manquante");else{const d=new Date(c.naissance),a=(Date.now()-d)/31557600000;if(isNaN(d))e.push("date de naissance illisible");else if(a<18)e.push("moins de 18 ans ("+Math.floor(a)+" ans) : à vérifier");else if(a>70)e.push("date de naissance douteuse ("+Math.floor(a)+" ans)");}
  if(!em(c.email))e.push("adresse mail invalide");
  const tel=(c.tel||"").replace(/[\s.\-]/g,"");if(!tel)w.push("téléphone non renseigné");else if(!/^(\+33|0033|0)[1-9]\d{8}$/.test(tel))w.push("téléphone inhabituel : "+c.tel);
  if(!(c.entreprise||"").trim())e.push("entreprise manquante");
  else if(i.employeur===null&&false)w.push("");
  if(!(i.champs||[]).length)e.push("champ d'intervention manquant");
  if(!i.niveau)e.push("niveau manquant");if(!i.exp)w.push("expérience non précisée");
  if(!i.attestMed)e.push("attestation médicale non renseignée");else if(/^non/i.test(i.attestMed))e.push("attestation médicale : NON (à obtenir avant la formation)");else if(/cours/i.test(i.attestMed))w.push("attestation médicale en cours");
  if(!i.adaptation)e.push("besoin d'aménagement non renseigné");
  if(c.profil==="recyclage"&&!(i.cacesDetenus||"").trim())e.push("recyclage : CACES ou autorisation précédent manquant");
  if(!i.certifieLe)e.push("fiche non certifiée par le stagiaire");
  const p=c.photo&&c.photo.url;const ph=!p?"manquante":(c.photo.white<0.6?"fond non blanc":"ok");
  return {ok:!e.length,e,w,photo:ph};}
function attList(){const t=(S.centre&&S.centre.attendus!==undefined)?S.centre.attendus:ATT_DEF;
  return String(t).split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split("|").map(x=>x.trim());return {nom:p[0]||"",mail:(p[1]||"").toLowerCase(),date:p[2]||""};});}
const _viewInsc0=viewInsc;
viewInsc=function(){const h=_viewInsc0(),L=attList(),cands=Object.values(S.cands).filter(c=>c.id!=="exemple"&&c.insc);
  const used=new Set();
  const rows=L.map(a=>{const c=cands.find(x=>(x.email||"").toLowerCase()===a.mail&&a.mail);if(c)used.add(c.id);
    if(!c)return `<tr><td>○</td><td>${esc(a.nom)}</td><td class="mono">${esc(a.date?"R489-"+a.date.replace(/-/g,""):"")}</td><td class="note">pas encore de retour</td><td></td></tr>`;
    const r=ficheCheck(c);
    return `<tr><td style="font-size:20px;color:${r.ok?"var(--ok)":"var(--bad)"}" title="${r.ok?"Fiche complète":"Fiche à corriger"}">${r.ok?"✓":"✗"}</td><td><b>${esc(a.nom)}</b></td><td class="mono">${esc(a.date?"R489-"+a.date.replace(/-/g,""):"")}</td>
     <td>${r.ok?`<span class="pill ok">Fiche complète</span>`:r.e.map(x=>`<div class="rerr" style="font-size:13px">• ${esc(x)}</div>`).join("")}${r.w.map(x=>`<div class="note">⚠ ${esc(x)}</div>`).join("")}</td>
     <td><span class="pill ${r.photo==="ok"?"ok":"warn"}">Photo : ${r.photo==="ok"?"reçue ✓":r.photo}</span></td></tr>`;}).join("");
  const hors=cands.filter(c=>!used.has(c.id));
  const hr=hors.length?`<p class="note" style="margin:10px 0 4px">Retours hors liste :</p>`+hors.map(c=>{const r=ficheCheck(c);return `<div>${r.ok?"✓":"✗"} ${esc(((c.nom||"")+" "+(c.prenom||"")).trim()||c.email||"?")} ${r.ok?"":`<span class="note">— ${esc(r.e.join(" ; "))}</span>`}</div>`;}).join(""):"";
  const nOk=L.filter(a=>{const c=cands.find(x=>(x.email||"").toLowerCase()===a.mail&&a.mail);return c&&ficheCheck(c).ok;}).length;
  const pan=`<section class="panel pad" style="margin-bottom:14px"><div class="eyebrow">Contrôle des fiches</div><h2 class="xh2">Retours des stagiaires <span class="note mono">${nOk}/${L.length} complètes</span></h2>
  <p class="note" style="margin-top:0">Chaque fiche reçue (code collé ou saisie en ligne) est contrôlée automatiquement : ✓ = toutes les informations obligatoires sont présentes et cohérentes ; ✗ = ce qui manque est indiqué ; ○ = pas encore de retour. La photo est suivie à part.</p>
  <div class="tscroll"><table><thead><tr><th></th><th>Stagiaire</th><th>N° de session</th><th>Contrôle</th><th>Photo</th></tr></thead><tbody>${rows||`<tr><td colspan="5" class="note">Aucun attendu. Ajoutez-en ci-dessous.</td></tr>`}</tbody></table></div>${hr}
  <details style="margin-top:10px"><summary class="note" style="cursor:pointer">Modifier la liste des attendus</summary><label class="f" style="margin-top:8px">Une personne par ligne : Nom Prénom | adresse mail | date de session (AAAA-MM-JJ)<textarea data-gatt="1" rows="8">${esc((S.centre&&S.centre.attendus!==undefined)?S.centre.attendus:ATT_DEF)}</textarea></label></details></section>`;
  return pan+h;};

function attApply(c){try{const a=attList().find(x=>x.mail&&x.mail===(c.email||"").toLowerCase());if(a&&a.date&&/^\d{4}-\d{2}-\d{2}$/.test(a.date)){c.arrivee=a.date;c.depart=a.date;c.dateTest=a.date;persist(c);}}catch(e){}}
importInscCode=function(text){const list=decodeInscAll(text);if(!list.length){toast("Code d'inscription invalide");return;}
  const res=[];list.forEach(o=>{const em=(o.e||"").toLowerCase(),all=Object.values(S.cands);
    let c=all.find(x=>x.code===o.c&&(!x.email||x.email.toLowerCase()===em))||all.find(x=>em&&(x.email||"").toLowerCase()===em&&x.reco===(RECOS[o.r]?o.r:x.reco));
    if(!c){c=newCand(RECOS[o.r]?o.r:"R489");c.code=(o.c&&!all.some(x=>x.code===o.c))?o.c:rnd(6);S.cands[c.id]=c;}
    applyInsc(c,o,"code");attApply(c);res.push({n:((c.nom||"")+" "+(c.prenom||"")).trim(),r:ficheCheck(c)});});
  const ok=res.filter(x=>x.r.ok).length,ko=res.filter(x=>!x.r.ok);
  toast(res.length+" fiche(s) importée(s) · "+ok+" complète(s) ✓"+(ko.length?" · à corriger : "+ko.map(x=>x.n).join(", "):""),!!ko.length);render();};
